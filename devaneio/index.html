<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141826">
<meta name="description" content="Jogo de cartas ilustradas e pistas vagas para jogar com os amigos, cada um no seu celular.">
<title>Devaneio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mesa de jogo à noite; uma coluna, cartas em grade, ações fixas no rodapé */
:root{
  --bg:#141826; --surface:#1d2236; --raised:#262c45; --line:#343b5a; --fg:#f3eee3; --muted:#a6abc2;
  --paper:#f3eee3; --gold:#f2b544; --on-gold:#20190a; --coral:#ea7a62; --green:#6cc9a1; --danger:#ff8a7a;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(242,181,68,.10),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(108,201,161,.06),transparent 50%);background-attachment:fixed}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px;display:flex;flex-direction:column;gap:18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(20,24,38,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-size:1.5rem;line-height:1;letter-spacing:.01em}
.logo small{display:block;font-family:var(--body);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.topbtns{display:flex;gap:6px;align-items:center}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;flex:none}
.dot.off{background:var(--danger)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:2.3rem}
h2{font-size:1.6rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:1rem;background:var(--gold);color:var(--on-gold);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:10px}
.btn.coral{background:var(--coral);color:#1e0d08}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.l{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;font-size:1.05rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{resize:none;min-height:84px}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-weight:700;text-align:center}
.note{font-size:.86rem;color:var(--muted);margin:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:18px 4px}
.fan{position:relative;height:200px;width:260px}
.fan img{position:absolute;bottom:0;left:50%;width:120px;border-radius:10px;border:5px solid var(--paper);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.fan img:nth-child(1){transform:translateX(-120%) rotate(-14deg)}
.fan img:nth-child(2){transform:translateX(-50%) translateY(-14px)}
.fan img:nth-child(3){transform:translateX(20%) rotate(14deg)}
.hero h1{font-size:3rem}

/* sala */
.bigcode{font-family:var(--display);font-size:3.6rem;letter-spacing:.18em;line-height:1;text-align:center}
.qr{background:#fff;padding:10px;border-radius:12px;align-self:center;width:180px;height:180px}
.qr img,.qr canvas{width:160px!important;height:160px!important}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);min-width:0}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl .tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#141826;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:10px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}

/* cartas */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid.table{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.table{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;border:0;padding:0;background:var(--paper);border-radius:12px;aspect-ratio:2/3;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .15s;max-width:100%}
.card img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:cover;border-radius:8px}
.card:active{transform:scale(.97)}
.card.sel{outline:4px solid var(--gold);outline-offset:2px}
.card.mine::after{content:"Sua carta";position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,24,38,.85);color:var(--fg);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.card .num{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:rgba(20,24,38,.85);color:var(--fg);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.card.st{outline:4px solid var(--coral);outline-offset:2px}
.card.voted{outline:4px solid var(--gold);outline-offset:2px}
.back{background:var(--raised);border:2px dashed var(--line);border-radius:12px;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--display);font-size:1.6rem}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.owner{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;min-width:0}
.owner span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voters{display:flex;flex-wrap:wrap;gap:4px}
.voters .av{width:24px;height:24px;font-size:.72rem}
.ribbon{position:absolute;top:10px;right:-6px;background:var(--coral);color:#1e0d08;font-weight:700;font-size:.72rem;padding:3px 10px;border-radius:6px 0 0 6px;letter-spacing:.06em;text-transform:uppercase}

/* pista */
.clue{background:var(--paper);color:#20190a;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.clue .who{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7a6a4c}
.clue .txt{font-family:var(--display);font-size:1.7rem;line-height:1.15;overflow-wrap:anywhere}
.wait{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:.85rem;background:var(--surface)}
.chip.done{opacity:.5}
.chip .av{width:22px;height:22px;font-size:.7rem}
.gains{display:flex;flex-wrap:wrap;gap:8px}
.gain{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700}
.gain b{color:var(--gold);font-variant-numeric:tabular-nums}

/* placar */
.track{display:flex;flex-direction:column;gap:10px}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.tr .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .sc{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.tr .bar{grid-column:2/4;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.tr .bar i{display:block;height:100%;border-radius:4px;transition:width .6s}

/* rodapé de ação */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,rgba(20,24,38,0));display:flex;justify-content:center}
.dock>*{max-width:728px;width:100%}

/* zoom */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,10,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.modal .big{height:min(58vh,560px);aspect-ratio:2/3;max-width:100%;background:var(--paper);border-radius:16px;padding:7px;box-shadow:0 20px 50px rgba(0,0,0,.6);flex:none}
.modal .big img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.modal .acts{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.sheet{position:fixed;inset:0;z-index:18;background:rgba(8,10,18,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);border-top:1px solid var(--line);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding-inline:16px;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rules ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.banner{background:rgba(255,138,122,.12);border:1px solid rgba(255,138,122,.4);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:#20190a;padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
.winner{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:10px}
.winner .who{font-family:var(--display);font-size:3.2rem;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Devaneio<small id="sub">Cartas e pistas vagas</small></div>
    <div class="topbtns">
      <span class="pill" id="net" hidden><span class="dot" id="netdot"></span><span id="nettx"></span></span>
      <button type="button" class="pill" data-act="sheet" data-v="placar" id="scoreBtn" hidden>Placar</button>
      <button type="button" class="pill" data-act="sheet" data-v="regras">Regras</button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>
<div class="dock" id="dock" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="art.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
"use strict";
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const MQTT_SRC=["https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js","https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"];
const DECK=DevaneioArt.count*2, MAXP=10;
const COLORS=["#f2b544","#ea7a62","#6cc9a1","#7ea6f2","#c58af0","#f28db2","#5cc8d6","#b8d46a","#e8a06b","#a3b1c9"];
const PARAMS=new URLSearchParams(location.search);
const LOCAL=PARAMS.has("local");

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=(n=10)=>{const a="abcdefghijkmnopqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s};
const shuffle=a=>{a=a.slice();const r=crypto.getRandomValues(new Uint32Array(a.length));for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const NS=LOCAL?(PARAMS.get("u")||""):"";
const store={get(k){try{return JSON.parse(localStorage.getItem(NS+k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2800)}
const img=id=>DevaneioArt.url(id);

/* ---------- identidade ---------- */
let me=store.get("dvn-me");
if(!me||!me.id){me={id:rid(),name:""};store.set("dvn-me",me)}

/* ---------- rede ---------- */
let net=null;
function loadMqtt(i){return new Promise((res,rej)=>{if(window.mqtt)return res();if(!navigator.onLine&&i===0){}if(i>=MQTT_SRC.length)return rej();const s=document.createElement("script");s.src=MQTT_SRC[i];s.onload=()=>res();s.onerror=()=>loadMqtt(i+1).then(res,rej);document.head.appendChild(s)})}
function makeNet(code,subs,onMsg,onUp){
  const base="devaneio/v1/"+code,seen=new Set(),q=[];
  const n={up:0,total:0,clients:[],pub(){},close(){}};
  function handle(sub,data){let o;try{o=JSON.parse(data)}catch(e){return}if(o.mid){if(seen.has(o.mid))return;seen.add(o.mid);q.push(o.mid);if(q.length>800)seen.delete(q.shift())}onMsg(sub,o)}
  const wants=sub=>subs.some(s=>s===sub);
  if(LOCAL){const bc=new BroadcastChannel(base);bc.onmessage=e=>{if(wants(e.data.sub))handle(e.data.sub,e.data.data)};
    n.pub=(sub,o)=>{o.mid=o.mid||rid(12);bc.postMessage({sub,data:JSON.stringify(o)})};n.close=()=>bc.close();n.up=n.total=1;setTimeout(()=>{onUp();netUI()},50);return n}
  n.total=BROKERS.length;
  const upd=()=>{n.up=n.clients.filter(c=>c.connected).length;netUI()};
  const M=window.mqtt&&(window.mqtt.connect?window.mqtt:window.mqtt.default);
  n.clients=BROKERS.map(url=>{const cl=M.connect(url,{clientId:"dvn_"+rid(12),clean:true,keepalive:30,reconnectPeriod:3000,connectTimeout:12000,protocolVersion:4});
    cl.on("connect",()=>{cl.subscribe(subs.map(s=>base+"/"+s),{qos:0});upd();onUp()});
    cl.on("close",upd);cl.on("offline",upd);cl.on("error",()=>{});
    cl.on("message",(t,p)=>{const sub=t.slice(base.length+1);if(!wants(sub))return;let str;try{str=typeof p==="string"?p:new TextDecoder().decode(p)}catch(e){str=String(p)}handle(sub,str)});return cl});
  n.pub=(sub,o,retain)=>{o.mid=o.mid||rid(12);const s=JSON.stringify(o);n.clients.forEach(cl=>{try{cl.publish(base+"/"+sub,s,{qos:0,retain:!!retain})}catch(e){}})};
  n.close=()=>n.clients.forEach(cl=>{try{cl.end(true)}catch(e){}});
  return n;
}
function netUI(){const el=$("#net");if(!net){el.hidden=true;return}el.hidden=false;const ok=net.up>0;$("#netdot").className="dot"+(ok?"":" off");$("#nettx").textContent=ok?code:"Conectando"}

/* ---------- estado do cliente ---------- */
let code=null,S=null,hand=[],played=[],handV=0,isHost=false,hostSeen=0,joinedAt=0;
let sel=[],modal=null,sheet=null,clueDraft="",pending=null,confirmKick=null,confirmSkip=false,homeName=me.name||"",homeCode=(PARAMS.get("sala")||"").toUpperCase().slice(0,4);
const myP=()=>S&&S.players.find(p=>p.id===me.id);
const P=id=>S&&S.players.find(p=>p.id===id)||{name:"Alguém",color:"#a3b1c9",id};
const iAmSt=()=>S&&S.st===me.id;

function onMsg(sub,o){
  if(sub==="in"){if(isHost)hHandle(o);return}
  if(sub==="hb"){hostSeen=Date.now();return}
  if(sub==="state"){if(!S||o.v>S.v){applyState(o)}hostSeen=Date.now();return}
  if(sub==="hand/"+me.id){if(o.v>=handV){handV=o.v;hand=o.cards||[];played=o.played||[];sel=sel.filter(c=>hand.includes(c));render()}}
}
function applyState(o){const prev=S;S=o;
  if(!prev||prev.phase!==o.phase||prev.round!==o.round){sel=[];confirmSkip=false;if(modal&&modal.kind!=="view")modal=null}
  checkPending();render()}
function hello(){if(!net||!code)return;if(isHost){hBroadcast();return}net.pub("in",{t:"hello",pid:me.id,name:me.name})}

async function enterRoom(c,asHost){
  code=c;isHost=asHost;S=null;hand=[];handV=0;joinedAt=Date.now();
  history.replaceState(null,"","?sala="+code+(LOCAL?"&local&u="+NS:""));
  store.set("dvn-last",{code});
  if(!LOCAL){try{await loadMqtt(0)}catch(e){toast("Não consegui carregar a conexão. Confira a internet e recarregue.");return}}
  const subs=isHost?["in"]:["state","hand/"+me.id,"hb"];
  net=makeNet(code,subs,onMsg,()=>hello());
  if(isHost){hResume();hBroadcast()}
  render();wake();
}
function leaveRoom(){if(net)net.close();net=null;code=null;S=null;isHost=false;hand=[];history.replaceState(null,"",location.pathname+(LOCAL?"?local":""));store.set("dvn-last",null);closeSheet();render();netUI()}

/* ação do jogador */
function act(t,data){data=data||{};const o=Object.assign({t,pid:me.id,gid:S&&S.gid,round:S&&S.round},data);
  pending={o,at:Date.now(),tries:0};
  if(isHost)hHandle(o);else net.pub("in",o);render()}
function reflected(p){if(!S)return false;const o=p.o;
  if(o.t==="clue")return S.phase!=="clue"||S.round!==o.round;
  if(o.t==="play")return (S.submitted||[]).includes(me.id)||S.phase!=="play";
  if(o.t==="vote")return (S.voted||[]).includes(me.id)||S.phase!=="vote";
  if(o.t==="next")return S.round!==o.round||S.phase!=="reveal";
  return true}
function checkPending(){if(pending&&reflected(pending))pending=null}
setInterval(()=>{
  if(!net||!code)return;
  if(pending&&!isHost){if(reflected(pending))pending=null;else if(Date.now()-pending.at>3500){pending.at=Date.now();if(++pending.tries>6){pending=null;toast("Sua jogada não chegou. Tente de novo.");render()}else{const o=Object.assign({},pending.o);delete o.mid;net.pub("in",o)}}}
  if(!isHost&&(!S||!myP())&&Date.now()-joinedAt>2000)hello();
},1500);
setInterval(()=>{if(net&&code&&!isHost)net.pub("in",{t:"ping",pid:me.id})},15000);
setInterval(()=>{if(code&&!isHost)render()},10000);

/* ---------- anfitrião ---------- */
let G=null;
const hKey=()=>"dvn-host-"+code;
function hResume(){G=store.get(hKey());if(!G||G.hostId!==me.id){G={gid:rid(),code,hostId:me.id,v:0,phase:"lobby",players:[],st:null,round:0,clue:"",stCard:null,plays:{},votes:{},table:[],deck:[],discard:[],hands:{},target:30,reveal:null,seen:{},handN:6,playN:1,kicked:[]}}if(!G.kicked)G.kicked=[];hJoin(me.id,me.name)}
function hOnline(pid){return pid===G.hostId||Date.now()-(G.seen[pid]||0)<45000}
function hPub(){return{gid:G.gid,code:G.code,hostId:G.hostId,v:G.v,phase:G.phase,round:G.round,st:G.st,clue:G.clue,target:G.target,playN:G.playN,handN:G.handN,deck:G.deck.length,
  players:G.players.map(p=>({id:p.id,name:p.name,score:p.score,color:p.color,on:hOnline(p.id)})),
  kicked:G.kicked,submitted:Object.keys(G.plays),voted:Object.keys(G.votes),table:(G.phase==="vote"||G.phase==="reveal")?G.table:null,reveal:G.phase==="reveal"||G.phase==="end"?G.reveal:null}}
let lastOnline="";
function hBroadcast(){if(!G)return;G.v=Math.max(G.v+1,Date.now());store.set(hKey(),G);const pub=hPub();lastOnline=pub.players.map(p=>p.on?1:0).join("");
  if(net){net.pub("state",pub,true);G.players.forEach(p=>net.pub("hand/"+p.id,{v:G.v,cards:G.hands[p.id]||[],played:G.plays[p.id]||[],round:G.round},true))}
  S=JSON.parse(JSON.stringify(pub));hand=(G.hands[me.id]||[]).slice();played=(G.plays[me.id]||[]).slice();handV=G.v;sel=sel.filter(c=>hand.includes(c));checkPending();render()}
setInterval(()=>{if(!isHost||!G||!net)return;net.pub("hb",{t:"hb"});const on=G.players.map(p=>hOnline(p.id)?1:0).join("");if(on!==lastOnline)hBroadcast()},10000);
function hDraw(){if(!G.deck.length){G.deck=shuffle(G.discard);G.discard=[]}
  const used=new Set();Object.values(G.hands).forEach(h=>h.forEach(c=>used.add(DevaneioArt.subject(c))));G.table.forEach(c=>used.add(DevaneioArt.subject(c)));Object.values(G.plays).forEach(cs=>cs.forEach(c=>used.add(DevaneioArt.subject(c))));if(G.stCard!=null)used.add(DevaneioArt.subject(G.stCard));
  for(let i=G.deck.length-1;i>=0;i--){if(!used.has(DevaneioArt.subject(G.deck[i]))){const c=G.deck[i];G.deck.splice(i,1);return c}}return G.deck.pop()}
function hDeal(pid){const h=G.hands[pid]||(G.hands[pid]=[]);while(h.length<G.handN&&(G.deck.length||G.discard.length))h.push(hDraw())}
function hJoin(pid,name){if(G.kicked.includes(pid))return false;name=String(name||"").trim().slice(0,20)||"Jogador";let p=G.players.find(x=>x.id===pid);
  if(!p){if(G.players.length>=MAXP)return false;const used=G.players.map(x=>x.color);p={id:pid,name,score:0,color:COLORS.find(c=>!used.includes(c))||COLORS[G.players.length%COLORS.length]};G.players.push(p);if(G.phase!=="lobby"&&G.phase!=="end")hDeal(pid)}
  else p.name=name;G.seen[pid]=Date.now();return true}
const nonSt=()=>G.players.filter(p=>p.id!==G.st).map(p=>p.id);
function hStart(){const n=G.players.length;if(n<3)return;G.handN=n===3?7:6;G.playN=n===3?2:1;G.deck=shuffle([...Array(DECK).keys()]);G.discard=[];G.hands={};
  G.players.forEach(p=>{p.score=0;hDeal(p.id)});G.st=G.players[Math.floor(Math.random()*n)].id;G.round=1;hNewRound()}
function hNewRound(){G.phase="clue";G.clue="";G.stCard=null;G.plays={};G.votes={};G.table=[];G.reveal=null}
function hToVote(){G.table=shuffle([G.stCard].concat(...Object.values(G.plays)));G.phase="vote"}
function hScore(){const voters=Object.keys(G.votes),finders=voters.filter(v=>G.votes[v]===G.stCard),gains={};G.players.forEach(p=>gains[p.id]=0);
  let kase="some";if(!voters.length)kase="none";else if(finders.length===0||finders.length===voters.length){kase=finders.length?"all":"none";nonSt().forEach(id=>gains[id]+=2)}else{gains[G.st]+=3;finders.forEach(id=>gains[id]+=3)}
  const owners={};owners[G.stCard]=G.st;Object.entries(G.plays).forEach(([pid,cs])=>cs.forEach(c=>owners[c]=pid));
  voters.forEach(v=>{const o=owners[G.votes[v]];if(o&&o!==G.st&&o!==v&&gains[o]!==undefined)gains[o]+=1});
  G.players.forEach(p=>p.score+=gains[p.id]||0);
  G.reveal={stCard:G.stCard,st:G.st,clue:G.clue,owners,votes:Object.assign({},G.votes),gains,kase,over:G.players.some(p=>p.score>=G.target)};
  G.discard.push(...G.table);G.players.forEach(p=>hDeal(p.id));G.phase="reveal"}
function hCheckPlays(){if(G.phase==="play"&&nonSt().every(id=>G.plays[id]))hToVote()}
function hCheckVotes(){if(G.phase==="vote"&&nonSt().every(id=>G.votes[id]))hScore()}
function hHandle(o){if(!G||!o||!o.pid)return;const pid=o.pid,isP=G.players.some(p=>p.id===pid);
  if(o.t==="ping"){const was=hOnline(pid);G.seen[pid]=Date.now();if(!was&&isP)hBroadcast();return}
  if(o.t==="hello"){if(!hJoin(pid,o.name)){return}hBroadcast();return}
  if(!isP)return;G.seen[pid]=Date.now();
  if(o.gid&&o.gid!==G.gid)return;
  const h=G.hands[pid]||[];
  switch(o.t){
    case"settings":if(pid!==G.hostId||G.phase!=="lobby")return;if([15,20,30].includes(o.target))G.target=o.target;break;
    case"start":if(pid!==G.hostId||(G.phase!=="lobby"&&G.phase!=="end"))return;hStart();break;
    case"clue":{if(G.phase!=="clue"||pid!==G.st||o.round!==G.round)return;const c=+o.card,clue=String(o.clue||"").trim().slice(0,140);if(!h.includes(c)||!clue)return;h.splice(h.indexOf(c),1);G.stCard=c;G.clue=clue;G.phase="play";break}
    case"play":{if(G.phase!=="play"||pid===G.st||G.plays[pid]||o.round!==G.round)return;const cs=(o.cards||[]).map(Number);if(cs.length!==G.playN||new Set(cs).size!==cs.length||!cs.every(c=>h.includes(c)))return;cs.forEach(c=>h.splice(h.indexOf(c),1));G.plays[pid]=cs;hCheckPlays();break}
    case"vote":{if(G.phase!=="vote"||pid===G.st||G.votes[pid]||o.round!==G.round)return;const c=+o.card;if(!G.table.includes(c)||(G.plays[pid]||[]).includes(c))return;G.votes[pid]=c;hCheckVotes();break}
    case"next":if(G.phase!=="reveal"||o.round!==G.round)return;if(G.reveal&&G.reveal.over){G.phase="end";break}{const i=G.players.findIndex(p=>p.id===G.st);G.st=G.players[(i+1)%G.players.length].id;G.round++;hNewRound()}break;
    case"skip":if(pid!==G.hostId)return;
      if(G.phase==="clue"){const i=G.players.findIndex(p=>p.id===G.st);G.st=G.players[(i+1)%G.players.length].id}
      else if(G.phase==="play"){if(!Object.keys(G.plays).length)return;hToVote()}
      else if(G.phase==="vote"){hScore()}else return;break;
    case"kick":{if(pid!==G.hostId||o.who===G.hostId)return;hKick(o.who);break}
    case"restart":if(pid!==G.hostId)return;G.discard=[];G.hands={};G.plays={};G.votes={};G.phase="lobby";G.players.forEach(p=>p.score=0);G.round=0;G.reveal=null;break;
    default:return}
  hBroadcast()}
function hKick(who){const i=G.players.findIndex(p=>p.id===who);if(i<0)return;G.kicked.push(who);
  G.discard.push(...(G.hands[who]||[]));delete G.hands[who];
  if(G.st===who&&G.phase!=="lobby"&&G.phase!=="end"){
    const next=G.players[(i+1)%G.players.length].id;
    if(G.stCard!=null)G.discard.push(G.stCard);Object.values(G.plays).forEach(cs=>G.discard.push(...cs));
    G.players.splice(i,1);G.st=next===who?(G.players[0]&&G.players[0].id):next;G.players.forEach(p=>hDeal(p.id));if(G.phase!=="reveal")hNewRound();
  }else{G.players.splice(i,1);if(G.plays[who]){if(G.phase==="play")G.discard.push(...G.plays[who]);delete G.plays[who]}delete G.votes[who];hCheckPlays();hCheckVotes()}
  if(G.players.length<3&&G.phase!=="lobby"){G.phase="lobby";G.round=0}}

/* ---------- interface ---------- */
function av(p,size){return `<span class="av" style="background:${esc(p.color)}${size?`;width:${size}px;height:${size}px`:""}">${esc((p.name||"?").trim().charAt(0).toUpperCase())}</span>`}
function cardBtn(id,o){o=o||{};return `<button type="button" class="card ${o.cls||""}" data-act="zoom" data-card="${id}" aria-label="Ver carta${o.num?" "+o.num:""}"><img src="${img(id)}" alt="" loading="lazy">${o.num?`<span class="num">${o.num}</span>`:""}${o.ribbon?`<span class="ribbon">${o.ribbon}</span>`:""}</button>`}
function clueBox(){const st=P(S.st);return `<div class="clue"><span class="who">Pista de ${esc(st.name)}</span><span class="txt">${esc(S.clue)}</span></div>`}
function waitChips(ids,doneIds){return `<div class="wait">${ids.map(id=>{const p=P(id);return `<span class="chip ${doneIds.includes(id)?"done":""}">${av(p)}${esc(p.name)}${p.on===false?" · sem sinal":""}</span>`}).join("")}</div>`}
function hostOffline(){return !isHost&&S&&hostSeen&&Date.now()-hostSeen>35000}

function render(){
  const v=$("#view"),dock=$("#dock");dock.hidden=true;dock.innerHTML="";
  $("#scoreBtn").hidden=!(S&&S.phase!=="lobby");
  $("#sub").textContent=S&&S.phase!=="lobby"&&S.phase!=="end"?`Rodada ${S.round}`:"Cartas e pistas vagas";
  if(!code){v.innerHTML=vHome();return}
  if(!S||!myP()){v.innerHTML=vJoining();return}
  const banner=hostOffline()?`<div class="banner">O celular de ${esc(P(S.hostId).name)}, que criou a sala, está sem conexão. O jogo continua quando ele voltar.</div>`:"";
  const f={lobby:vLobby,clue:vClue,play:vPlay,vote:vVote,reveal:vReveal,end:vEnd}[S.phase];
  v.innerHTML=banner+f();
  if(S.phase==="lobby")drawQR();
  if(sheet)renderSheet();
}
function setDock(html){const d=$("#dock");d.innerHTML=`<div>${html}</div>`;d.hidden=false}

function vHome(){
  const fan=[7,22,35].map(i=>`<img src="${img(i)}" alt="">`).join("");
  const joining=!!homeCode&&homeCode.length===4;
  return `<div class="hero"><div class="fan">${fan}</div><h1>Devaneio</h1><p class="lead">Um narrador dá uma pista vaga sobre uma carta. Cada um esconde uma carta parecida. Quem acha a carta do narrador pontua.</p></div>
  <div class="panel">
    <label class="l" for="nameIn">Seu nome</label>
    <input type="text" id="nameIn" maxlength="20" autocomplete="nickname" placeholder="Como os amigos te chamam" value="${esc(homeName)}">
    ${joining?`<button type="button" class="btn block" data-act="join">Entrar na sala ${esc(homeCode)}</button><button type="button" class="btn ghost block" data-act="forgetCode">Criar outra sala</button>`:
    `<button type="button" class="btn block" data-act="create">Criar sala</button>
    <div class="or">ou entre numa sala</div>
    <div class="row"><input type="text" id="codeIn" class="code-in" maxlength="4" placeholder="CÓDIGO" value="${esc(homeCode)}" autocomplete="off" style="flex:1;min-width:0"><button type="button" class="btn ghost" data-act="join">Entrar</button></div>`}
  </div>
  <p class="note">De 3 a 10 jogadores, cada um no seu celular. Quem cria a sala precisa deixar o jogo aberto até o fim.</p>`;
}
function vJoining(){const waited=Date.now()-joinedAt;return `<div class="panel" style="text-align:center;align-items:center;padding-block:28px"><span class="eyebrow">Sala ${esc(code)}</span><h2>${S?"Entrando na sala…":waited>12000?"Não encontrei essa sala":"Entrando na sala…"}</h2>
  <p class="lead">${!S&&waited>12000?"Confira o código com quem criou a sala e se o celular dele está com o jogo aberto.":"Conectando com os outros jogadores."}</p>
  ${S&&!myP()&&(S.kicked||[]).includes(me.id)?`<p class="note">Você foi removido desta sala.</p>`:S&&!myP()&&S.players.length>=MAXP?`<p class="note">A sala está cheia.</p>`:""}
  <button type="button" class="btn ghost small" data-act="leave">Voltar</button></div>`}
function inviteUrl(){return location.origin+location.pathname+"?sala="+code}
function vLobby(){
  const host=P(S.hostId),n=S.players.length;
  const tgt=isHost?`<div class="stack" style="gap:8px"><label class="l">Pontos para vencer</label><div class="seg" role="group">${[15,20,30].map(t=>`<button type="button" data-act="target" data-v="${t}" aria-pressed="${S.target===t}">${t}</button>`).join("")}</div></div>`:"";
  if(isHost)setDock(`<button type="button" class="btn block" data-act="start" ${n<3?"disabled":""}>${n<3?`Faltam ${3-n} jogador${3-n>1?"es":""}`:"Começar partida"}</button>`);

  <div class="panel"><div class="qr" id="qr" aria-label="QR code do convite"></div>
    <button type="button" class="btn ghost block" data-act="invite">Convidar amigos</button>
    <p class="note" style="text-align:center">Os amigos escaneiam o QR ou abrem o link e digitam o nome.</p></div>
  <div class="panel"><div class="row" style="justify-content:space-between"><span class="l">Jogadores · ${n}</span><span class="note">3 a ${MAXP}</span></div>
    <div class="players">${S.players.map(p=>`<div class="pl">${av(p)}<span class="nm">${esc(p.name)}${p.id===me.id?" (você)":""}</span>${p.id===S.hostId?`<span class="tag">Anfitrião</span>`:""}${isHost&&p.id!==me.id?`<button type="button" class="btn ghost small" data-act="kick" data-v="${p.id}">${confirmKick===p.id?"Confirmar":"Remover"}</button>`:""}</div>`).join("")}</div>
    ${tgt}
    ${isHost?"":`<p class="note">Aguardando ${esc(host.name)} começar a partida.</p>`}
  </div>
  <button type="button" class="btn ghost small" data-act="leave" style="align-self:flex-start">Sair da sala</button>`;
}
let qrTries=0;
function drawQR(){const el=$("#qr");if(!el)return;if(!window.QRCode){if(++qrTries<20)setTimeout(drawQR,500);else el.hidden=true;return}const u=inviteUrl();el.innerHTML="";try{new QRCode(el,{text:u,width:160,height:160,colorDark:"#141826",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){el.hidden=true}}
function handGrid(o){o=o||{};return `<div class="grid">${hand.map(id=>cardBtn(id,{cls:sel.includes(id)?"sel":""})).join("")}</div>`}
function vClue(){const st=P(S.st);
  if(iAmSt()){
    if(pending&&pending.o.t==="clue")return `<div class="panel"><h2>Enviando sua pista…</h2></div>`;
    return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · você é o narrador</span><h1>Escolha uma carta e invente uma pista</h1>
    <p class="lead">Pode ser uma palavra, uma frase, um título de filme, um som. Se todo mundo acertar ou ninguém acertar, você não pontua.</p></div>${handGrid()}`}
  return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round}</span><h1>${esc(st.name)} está pensando numa pista</h1><p class="lead">Enquanto isso, dê uma olhada nas suas cartas.</p></div>${handGrid()}${hostSkip("Pular narrador")}`}
function hostSkip(label){if(!isHost)return"";return confirmSkip?`<div class="panel"><span>${label==="Pular narrador"?"Passar a vez de narrador para o próximo jogador?":"Seguir sem esperar quem falta?"}</span><div class="row"><button type="button" class="btn small" data-act="skip">Confirmar</button><button type="button" class="btn ghost small" data-act="noskip">Esperar mais</button></div></div>`:`<button type="button" class="btn ghost small" data-act="askSkip" style="align-self:flex-start">${label}</button>`}
function vPlay(){const others=S.players.filter(p=>p.id!==S.st).map(p=>p.id),done=S.submitted||[];
  if(iAmSt())return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · você é o narrador</span><h2>Os outros estão escolhendo cartas para a sua pista</h2></div>${clueBox()}${waitChips(others,done)}${hostSkip("Seguir sem quem falta")}`;
  if(done.includes(me.id)||(pending&&pending.o.t==="play"))return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round}</span><h2>${done.includes(me.id)?"Carta enviada":"Enviando…"}</h2><p class="lead">Aguardando os outros jogadores.</p></div>${clueBox()}${waitChips(others,done)}${hostSkip("Seguir sem quem falta")}`;
  const n=S.playN;if(n>1&&sel.length)setDock(`<button type="button" class="btn block" data-act="play" ${sel.length!==n?"disabled":""}>${sel.length===n?`Jogar ${n} cartas`:`Escolha mais ${n-sel.length}`}</button>`);
  return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round}</span><h2>${n>1?"Escolha duas cartas":"Escolha a carta"} que mais combina com a pista</h2></div>${clueBox()}${handGrid()}`}
function myCards(){return (S.reveal&&S.reveal.owners)?Object.keys(S.reveal.owners).filter(c=>S.reveal.owners[c]===me.id).map(Number):[]}
function vVote(){const others=S.players.filter(p=>p.id!==S.st).map(p=>p.id),done=S.voted||[],mine=playedByMe();
  const voted=done.includes(me.id)||(pending&&pending.o.t==="vote");const can=!iAmSt()&&!voted;
  const grid=`<div class="grid table">${S.table.map((c,i)=>cardBtn(c,{num:i+1,cls:(mine.includes(c)?"mine ":"")+(pending&&pending.o.t==="vote"&&+pending.o.card===c?"voted":"")})).join("")}</div>`;
  return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · votação</span><h2>${iAmSt()?"Os outros estão procurando a sua carta":voted?"Voto registrado":"Qual é a carta do narrador?"}</h2>${can?`<p class="lead">Toque numa carta para ver de perto e votar. Não vale votar na sua.</p>`:""}</div>${clueBox()}${grid}${waitChips(others,done)}${hostSkip("Seguir sem quem falta")}`}
function playedByMe(){return played.length?played:(lastPlayed.round===S.round?lastPlayed.cards:[])}
let lastPlayed={round:-1,cards:[]};
function vReveal(){const R=S.reveal,st=P(R.st);
  const msg={some:`${esc(st.name)} acertou na medida`,all:"Todo mundo achou. Pista óbvia demais",none:"Ninguém achou. Pista vaga demais"}[R.kase];
  const voteMap={};Object.entries(R.votes).forEach(([v,c])=>(voteMap[c]=voteMap[c]||[]).push(v));
  const grid=`<div class="grid table">${S.table.map((c,i)=>{const o=P(R.owners[c]),isSt=c===R.stCard,vs=voteMap[c]||[];
    return `<div class="slot">${cardBtn(c,{num:i+1,cls:isSt?"st":"",ribbon:isSt?"Narrador":""})}<div class="owner">${av(o)}<span>${esc(o.name)}</span></div>${vs.length?`<div class="voters">${vs.map(id=>av(P(id))).join("")}</div>`:`<span class="note">Sem votos</span>`}</div>`}).join("")}</div>`;
  const gains=S.players.filter(p=>R.gains[p.id]).sort((a,b)=>R.gains[b.id]-R.gains[a.id]).map(p=>`<span class="gain">${av(p)}${esc(p.name)} <b>+${R.gains[p.id]}</b></span>`).join("")||`<span class="note">Ninguém pontuou nesta rodada.</span>`;
  setDock(`<button type="button" class="btn block" data-act="next" ${pending&&pending.o.t==="next"?"disabled":""}>${R.over?"Ver o vencedor":"Próxima rodada"}</button>`);
  return `<div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · resultado</span><h1>${msg}</h1></div>${clueBox()}
  <div class="panel"><span class="l">Pontos da rodada</span><div class="gains">${gains}</div></div>${grid}${track()}`}
function track(){const max=S.target;return `<div class="panel"><span class="l">Placar · meta ${max}</span><div class="track">${S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="tr">${av(p)}<span class="nm">${esc(p.name)}${p.on?"":" · sem sinal"}</span><span class="sc">${p.score}</span><div class="bar"><i style="width:${Math.min(100,p.score/max*100)}%;background:${esc(p.color)}"></i></div></div>`).join("")}</div></div>`}
function vEnd(){const top=Math.max(...S.players.map(p=>p.score)),W=S.players.filter(p=>p.score===top);
  if(isHost)setDock(`<button type="button" class="btn block" data-act="restart">Nova partida com a mesma sala</button>`);
  return `<div class="panel winner"><span class="eyebrow">${W.length>1?"Empate":"Vencedor"}</span><div class="who">${W.map(p=>esc(p.name)).join(" e ")}</div><p class="lead">${top} pontos</p></div>${track()}
  ${isHost?"":`<p class="note">Quem criou a sala pode começar uma nova partida.</p>`}<button type="button" class="btn ghost small" data-act="leave" style="align-self:flex-start">Sair da sala</button>`}

/* zoom */
function openZoom(card){
  let kind="view";
  if(S.phase==="clue"&&iAmSt()&&hand.includes(card)&&!pending)kind="clue";
  else if(S.phase==="play"&&!iAmSt()&&hand.includes(card)&&!(S.submitted||[]).includes(me.id)&&!pending)kind="play";
  else if(S.phase==="vote"&&!iAmSt()&&S.table.includes(card)&&!(S.voted||[]).includes(me.id)&&!pending)kind=playedByMe().includes(card)?"own":"vote";
  modal={card,kind};renderModal()}
function renderModal(){const m=$("#modal");if(!modal){m.hidden=true;m.innerHTML="";return}
  const c=modal.card;let acts="";
  if(modal.kind==="clue")acts=`<label class="l" for="clueIn">Sua pista</label><textarea id="clueIn" maxlength="140" placeholder="Ex.: saudade, Interestelar, o fim de um domingo">${esc(clueDraft)}</textarea><button type="button" class="btn block" data-act="sendClue">Enviar pista com esta carta</button>`;
  if(modal.kind==="play"){if(S.playN>1){const on=sel.includes(c);acts=`<button type="button" class="btn block" data-act="toggleSel">${on?"Desmarcar carta":"Escolher esta carta"}</button><p class="note" style="text-align:center">${sel.length} de ${S.playN} escolhidas</p>`}else acts=`<button type="button" class="btn block" data-act="playOne">Jogar esta carta</button>`}
  if(modal.kind==="vote")acts=`<button type="button" class="btn block" data-act="vote">Votar nesta carta</button>`;
  if(modal.kind==="own")acts=`<p class="note" style="text-align:center">Esta é a sua carta. Não dá para votar nela.</p>`;
  const num=S&&S.table&&S.table.includes(c)&&S.phase!=="play"?`<span class="eyebrow">Carta ${S.table.indexOf(c)+1}</span>`:"";
  m.innerHTML=`${num}<div class="big"><img src="${img(c)}" alt="Carta ilustrada"></div>${S&&S.clue&&S.phase!=="clue"?`<div class="clue" style="width:100%;max-width:420px">${clueBox().replace(/^<div class="clue">|<\/div>$/g,"")}</div>`:""}<div class="acts">${acts}<button type="button" class="btn ghost block" data-act="closeModal">Fechar</button></div>`;
  m.hidden=false}

/* folhas */
function openSheet(k){sheet=k;renderSheet();$("#sheet").hidden=false}
function closeSheet(){sheet=null;confirmKick=null;$("#sheet").hidden=true}
function renderSheet(){const el=$("#sheetIn");const head=t=>`<div class="sheet-head"><h2>${t}</h2><button type="button" class="btn ghost small" data-act="closeSheet">Fechar</button></div>`;
  if(sheet==="regras")el.innerHTML=head("Como jogar")+`<div class="rules"><ol>
   <li>A cada rodada, um jogador é o <b>narrador</b>. Ele escolhe uma carta da mão e escreve uma pista: uma palavra, frase, som ou título.</li>
   <li>Os outros escolhem, em segredo, a carta da própria mão que mais combina com a pista.</li>
   <li>As cartas são embaralhadas e mostradas para todos. Cada um vota na carta que acha que é do narrador. Não vale votar na própria.</li>
   <li>Se <b>todos</b> ou <b>ninguém</b> acharem a carta do narrador, ele faz 0 e os outros fazem 2 pontos.</li>
   <li>Se só <b>alguns</b> acharem, o narrador e quem acertou fazem 3 pontos.</li>
   <li>Cada jogador ganha mais 1 ponto por voto que a carta dele recebeu.</li>
   <li>Ganha quem chegar primeiro à meta. Com 3 jogadores, cada um tem 7 cartas e joga 2 por rodada.</li></ol>
   <p class="note">O segredo é dar uma pista nem tão óbvia, nem tão vaga.</p></div>`;
  if(sheet==="placar"&&S){el.innerHTML=head("Placar")+track()+(isHost?`<div class="panel"><span class="l">Jogadores</span><div class="players">${S.players.filter(p=>p.id!==me.id).map(p=>`<div class="pl">${av(p)}<span class="nm">${esc(p.name)}${p.on?"":" · sem sinal"}</span><button type="button" class="btn ghost small" data-act="kick" data-v="${p.id}">${confirmKick===p.id?"Confirmar":"Remover"}</button></div>`).join("")}</div><p class="note">Remova quem saiu de vez para o jogo não ficar esperando.</p></div>`:"")+
    `<button type="button" class="btn ghost" data-act="leave">Sair da sala</button>`}
}

/* eventos */
document.addEventListener("input",e=>{const t=e.target;if(t.id==="nameIn")homeName=t.value;if(t.id==="codeIn"){t.value=t.value.toUpperCase().replace(/[^A-Z]/g,"");homeCode=t.value}if(t.id==="clueIn")clueDraft=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modal){modal=null;renderModal()}else if(sheet)closeSheet()}if(e.key==="Enter"&&(e.target.id==="codeIn"||e.target.id==="nameIn")&&!code){e.preventDefault();(document.querySelector('[data-act="join"]')||document.querySelector('[data-act="create"]')).click()}});
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  const needName=()=>{const n=homeName.trim();if(!n){toast("Digite seu nome.");$("#nameIn")&&$("#nameIn").focus();return false}me.name=n.slice(0,20);store.set("dvn-me",me);return true};
  switch(a){
    case"create":if(!needName())return;{const L="BCDFGHJKLMNPQRSTVWXZ";let c="";crypto.getRandomValues(new Uint8Array(4)).forEach(x=>c+=L[x%L.length]);enterRoom(c,true)}return;
    case"join":if(!needName())return;if(!/^[A-Z]{4}$/.test(homeCode)){toast("O código tem 4 letras.");return}{const h=store.get("dvn-host-"+homeCode);enterRoom(homeCode,!!(h&&h.hostId===me.id))}return;
    case"forgetCode":homeCode="";history.replaceState(null,"",location.pathname+(LOCAL?"?local":""));render();return;
    case"leave":leaveRoom();return;
    case"sheet":openSheet(v);return;
    case"closeSheet":closeSheet();return;
    case"invite":{const u=inviteUrl();if(navigator.share){navigator.share({title:"Devaneio",text:`Entra na minha sala do Devaneio: ${code}`,url:u}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>toast("Link copiado."),()=>toast(u))}else toast(u)}return;
    case"target":act("settings",{target:+v});return;
    case"start":act("start");return;
    case"kick":if(confirmKick!==v){confirmKick=v;render();return}confirmKick=null;act("kick",{who:v});return;
    case"askSkip":confirmSkip=true;render();return;
    case"noskip":confirmSkip=false;render();return;
    case"skip":confirmSkip=false;act("skip");return;
    case"zoom":openZoom(+b.dataset.card);return;
    case"closeModal":modal=null;renderModal();return;
    case"sendClue":{const t=clueDraft.trim();if(!t){toast("Escreva uma pista.");$("#clueIn").focus();return}const c=modal.card;modal=null;renderModal();clueDraft="";act("clue",{card:c,clue:t})}return;
    case"playOne":{const c=modal.card;modal=null;renderModal();lastPlayed={round:S.round,cards:[c]};act("play",{cards:[c]})}return;
    case"toggleSel":{const c=modal.card;if(sel.includes(c))sel=sel.filter(x=>x!==c);else if(sel.length<S.playN)sel.push(c);else{toast(`Você já escolheu ${S.playN}. Desmarque uma antes.`);return}modal=null;renderModal();render()}return;
    case"play":if(sel.length!==S.playN)return;lastPlayed={round:S.round,cards:sel.slice()};act("play",{cards:sel.slice()});sel=[];return;
    case"vote":{const c=modal.card;modal=null;renderModal();act("vote",{card:c})}return;
    case"next":act("next");return;
    case"restart":act("restart");return;
  }
});
async function wake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&code){wake();hello()}});

/* início */
(function boot(){
  const last=store.get("dvn-last");
  if(homeCode&&me.name&&last&&last.code===homeCode){const h=store.get("dvn-host-"+homeCode);enterRoom(homeCode,!!(h&&h.hostId===me.id));return}
  render();
})();
</script>
</body>
</html>
