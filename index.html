<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jogo de debate eleitoral para jogar presencialmente com os amigos.">
<meta name="theme-color" content="#0B7A4B">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ordem e Regresso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: one-column app shell, one stage per screen; the ballot box is drawn as a physical object */
:root{
  --bg:#ECEEE8; --fg:#171B18; --muted:#5B625C; --surface:#FBFBF8; --line:#D0D4CA;
  --green:#0B7A4B; --on-green:#FFFFFF; --gold:#F0BE2A; --on-gold:#1C1A10; --blue:#203E8C;
  --urna:#CFC7B0; --urna-edge:#A99F84; --lcd:#E2EAD7; --lcd-ink:#1C2A1E;
  --keypad:#262624; --key:#3B3B38; --key-ink:#F4F4F0; --orange:#E2772A; --white-key:#F3F1EA; --danger:#B3261E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lcdfont:"VT323",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --fg:#E7EBE5; --muted:#9BA49C; --surface:#181D1A; --line:#2B322D;
  --green:#22A468; --on-green:#06140D; --gold:#F0BE2A; --on-gold:#1C1A10; --blue:#93ACF5;
  --urna:#4A463B; --urna-edge:#615A4A; --lcd:#CFDCC2; --lcd-ink:#13201A; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --fg:#E7EBE5; --muted:#9BA49C; --surface:#181D1A; --line:#2B322D;
  --green:#22A468; --on-green:#06140D; --gold:#F0BE2A; --on-gold:#1C1A10; --blue:#93ACF5;
  --urna:#4A463B; --urna-edge:#615A4A; --lcd:#CFDCC2; --lcd-ink:#13201A; --danger:#FF8A80; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.shell{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:2px solid var(--fg);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-family:var(--display);font-weight:900;font-size:1.55rem;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.68rem;letter-spacing:.14em;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav button{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1;margin:0;text-wrap:balance}
h1{font-size:2.4rem}
h2{font-size:1.6rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:14px 20px;font-weight:700;font-size:1rem;background:var(--green);color:var(--on-green);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1;min-width:0}
.x{background:none;border:1.5px solid var(--line);border-radius:8px;width:42px;height:42px;font-size:1.2rem;color:var(--muted);flex:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:10px 6px;font-weight:600;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.note{font-size:.85rem;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{left:25px}

/* placar */
.scores{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem;background:var(--surface)}
.chip b{font-variant-numeric:tabular-nums}
.chip .n{font-family:var(--lcdfont);font-size:1.05rem;color:var(--muted)}
.chip.lead-chip{border-color:var(--gold)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.roles .panel{padding:12px;gap:6px}
.roles ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-weight:600}

/* carta de crise */
.flip{perspective:1200px;border:0;background:none;padding:0;width:100%;text-align:left}
.flip-in{position:relative;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;min-height:280px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.cardback{background:var(--blue);color:var(--surface);align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;
  background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.07) 14px 28px)}
:root[data-theme="dark"] .cardback{color:#0F1311}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cardback{color:#0F1311}}
.cardback .big{font-family:var(--display);font-weight:900;font-size:2.2rem;text-transform:uppercase;line-height:.95}
.cardback .tap{font-size:.85rem;font-weight:600;opacity:.85}
.crise{background:var(--surface);border:2.5px solid var(--fg);padding:18px;gap:14px;overflow:hidden}
.crise .head{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--fg);padding-bottom:8px}
.crise .head span{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.crise p{font-size:1.4rem;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.stamp{position:absolute;right:14px;bottom:14px;font-family:var(--display);font-weight:900;font-size:1.3rem;letter-spacing:.06em;color:var(--danger);border:3px solid var(--danger);padding:2px 10px;transform:rotate(-8deg);border-radius:6px;opacity:.9}
.crise-static{position:relative;min-height:auto;border-radius:16px}

/* santinho */
.santos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.santo .flip-in{min-height:290px}
.sface{background:var(--surface);border:2px solid var(--fg);overflow:hidden}
.sface .band{background:var(--gold);color:var(--on-gold);display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:800;letter-spacing:.12em;font-size:.75rem}
.sface .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.sface .num{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:.85;font-variant-numeric:tabular-nums}
.sface .nm{font-weight:700;font-size:1.1rem}
.sface .prop{margin-top:auto;border-top:1.5px dashed var(--line);padding-top:10px}
.sface .prop .label{font-size:.68rem}
.sface .prop p{margin:4px 0 0;font-size:1.25rem;font-weight:700;line-height:1.2}
.santo-actions{display:flex;justify-content:flex-end;margin-top:8px;min-height:36px}

/* debate */
.clock{font-family:var(--lcdfont);font-size:5.5rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums;background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:10px 0 4px;border:3px solid var(--urna-edge)}
.clock.low{color:var(--danger)}
.speaker{display:flex;flex-direction:column;gap:4px;text-align:center}
.speaker .who{font-family:var(--display);font-weight:900;font-size:2.4rem;text-transform:uppercase;line-height:1}
.speaker .what{font-size:1.1rem;font-weight:600}
.order{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.order span{font-size:.82rem;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line)}
.order span.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.order span.done{opacity:.45;text-decoration:line-through}

/* urna */
.urna{background:var(--urna);border:3px solid var(--urna-edge);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr;gap:14px;box-shadow:0 10px 0 var(--urna-edge)}
@media (min-width:640px){.urna{grid-template-columns:1.25fr 1fr;align-items:stretch}}
.lcd{background:var(--lcd);color:var(--lcd-ink);font-family:var(--lcdfont);border-radius:6px;padding:12px 14px;min-height:260px;display:flex;flex-direction:column;gap:6px;border:4px solid #1d1d1b;font-size:1.35rem;line-height:1.1}
.lcd .t1{font-size:1.05rem}
.lcd .t2{font-size:1.9rem;text-align:center;letter-spacing:.04em}
.digits{display:flex;gap:8px;align-items:center}
.digit{width:38px;height:48px;border:2px solid var(--lcd-ink);display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.digit.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:var(--lcd-ink);color:var(--lcd)}}
.lcd .info{display:flex;flex-direction:column;gap:2px}
.lcd .foot{margin-top:auto;border-top:2px solid var(--lcd-ink);padding-top:6px;font-size:1rem}
.lcd .big{font-size:2.2rem;text-align:center;margin:auto 0}
.lcd .fim{font-size:5rem;text-align:center;margin:auto 0;letter-spacing:.1em}
.keypad{background:var(--keypad);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad .k{background:var(--key);color:var(--key-ink);border:0;border-radius:6px;font-size:1.5rem;font-weight:700;height:52px;box-shadow:0 3px 0 #111}
.keypad .k:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
.keypad .k0{grid-column:2}
.keypad .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.keypad .acts button{border:0;border-radius:6px;font-weight:800;font-size:.8rem;letter-spacing:.05em;height:52px;box-shadow:0 3px 0 #111}
.kb{background:var(--white-key);color:#1d1d1b}
.kc{background:var(--orange);color:#1d1d1b}
.kk{background:#159152;color:#fff;font-size:.86rem}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cover{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.cover .who{font-family:var(--display);font-weight:900;font-size:3rem;text-transform:uppercase;line-height:1}
.progress{display:flex;gap:4px;justify-content:center}
.progress i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--green)}

/* votação aberta */
.vrow{padding:12px;gap:10px}
.vname{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.vname .ok{color:var(--green);font-weight:800}
.vopts{display:flex;flex-wrap:wrap;gap:8px}
.vopt{flex:1 1 120px;min-height:48px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;font-weight:700;padding:8px 10px}
.vopt.vb{flex:0 1 90px;font-weight:600;color:var(--muted)}
.vopt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.vopt.vb[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* apuração */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.bar .nm{font-weight:700;min-width:0}
.bar .nm span{font-family:var(--lcdfont);color:var(--muted);font-weight:400;margin-right:6px}
.bar .v{font-family:var(--display);font-weight:900;font-size:1.6rem;font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--fg);border-radius:7px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar.win .fill{background:var(--green)}
.bar .p{grid-column:1/-1;font-size:.88rem;color:var(--muted)}
.eleito{display:inline-block;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:.7rem;letter-spacing:.12em;padding:3px 8px;border-radius:4px;margin-left:6px;vertical-align:middle}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table td{padding:8px 4px;border-bottom:1px solid var(--line)}
.table td:last-child{text-align:right;font-weight:800}
.winner{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:10px}
.winner .who{font-family:var(--display);font-weight:900;font-size:3.6rem;line-height:.9;text-transform:uppercase;text-wrap:balance}
.sash{background:linear-gradient(90deg,var(--green) 0 33%,var(--gold) 33% 66%,var(--blue) 66%);height:8px;width:160px;border-radius:4px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,12,11,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding-inline:16px;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rules ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.clist li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.clist li span{min-width:0}
.clist li button{background:none;border:0;color:var(--muted);font-size:1.1rem;flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Ordem e Regresso<small id="sub">Debate eleitoral de mesa</small></div>
    <nav class="nav">
      <button type="button" data-act="sheet" data-v="regras">Regras</button>
      <button type="button" data-act="sheet" data-v="baralho">Baralho</button>
      <button type="button" data-act="sheet" data-v="menu" id="menuBtn" hidden>Partida</button>
    </nav>
  </header>
  <main id="view" class="stack"></main>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){S=d.S||null;if(d.C)C=d.C;if(d.draft)draft=d.draft;if(S&&d.deckV!==DECK_V)S.bags={c:[],p:[]};}}catch(e){}if(!draft.voteMode)draft.voteMode="aberta";if(S&&S.settings&&!S.settings.voteMode)S.settings.voteMode="aberta"}
const DECK_V=2;
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,C,draft,deckV:DECK_V}))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(k){const base=k==="c"?DEF_CRISES:DEF_PROPS,mine=k==="c"?C.crises:C.props;const p=(C.useDefault?base:[]).concat(mine);return p.length?p:base}
function draw(k){if(!S.bags[k]||!S.bags[k].length)S.bags[k]=shuffle(pool(k));return S.bags[k].pop()}
function drawUnique(k,taken){let c=draw(k),t=0;while(taken.has(c)&&t++<12)c=draw(k);taken.add(c);return c}
const P=id=>S.players.find(p=>p.id===id);

/* ---------- jogo ---------- */
function startGame(keepPlayers){
  let players;
  if(keepPlayers&&S){players=S.players.map(p=>({...p,score:0}))}
  else{
    const names=draft.names.map(n=>n.trim()).filter(Boolean);
    if(names.length<3){toast("Coloque pelo menos 3 jogadores.");return}
    const used=new Set();
    players=names.map((name,i)=>{let n;do{n=10+Math.floor(Math.random()*90)}while(used.has(n));used.add(n);return{id:"p"+i+"_"+Date.now().toString(36),name,num:n,score:0}});
  }
  const st=keepPlayers&&S?S.settings:{perRound:Math.min(draft.perRound,players.length-1),target:draft.target,debateSec:draft.debateSec,swaps:draft.swaps,voteMode:draft.voteMode};
  S={players,settings:st,round:0,rot:Math.floor(Math.random()*players.length),bags:{c:[],p:[]}};
  startRound();wake();
}
function startRound(){
  const n=S.players.length,k=S.settings.perRound,cands=[];
  for(let i=0;i<k;i++)cands.push(S.players[(S.rot+i)%n].id);
  S.rot=(S.rot+k)%n;S.round++;
  S.cands=cands;S.voters=shuffle(S.players.map(p=>p.id).filter(id=>!cands.includes(id)));
  S.crisis=draw("c");S.crisisShown=false;
  const taken=new Set();S.props={};S.shown={};S.swapped={};
  cands.forEach(id=>S.props[id]=drawUnique("p",taken));
  S.debate={idx:0,left:S.settings.debateSec,running:false};
  S.vote={idx:0,stage:"cover",votes:{}};S.result=null;
  S.phase="crise";typed="";
}
function tally(){
  const counts={};S.cands.forEach(id=>counts[id]=0);let branco=0,nulo=0;
  Object.values(S.vote.votes).forEach(v=>{if(v==="branco")branco++;else if(v==="nulo")nulo++;else counts[v]++});
  S.cands.forEach(id=>P(id).score+=counts[id]);
  S.result={counts,branco,nulo};S.phase="apuracao";
}
function leaders(){const m=Math.max(...S.players.map(p=>p.score));return S.players.filter(p=>p.score===m)}

let actx=null;
function tone(f,t0,d,vol){const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.value=vol||.06;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t0);o.stop(actx.currentTime+t0+d)}
function urnaSound(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.11,.22,.33,.44].forEach((t,i)=>tone(i%2?1400:1200,t,.09))}catch(e){}}
function buzz(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();tone(220,0,.5,.08)}catch(e){}}
function click(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();tone(900,0,.03,.04)}catch(e){}}
async function wake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}

function scoreChips(){
  const top=Math.max(...S.players.map(p=>p.score));
  return `<div class="scores">${S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<span class="chip ${p.score===top&&top>0?"lead-chip":""}"><span class="n">${p.num}</span>${esc(p.name)} <b>${p.score}</b></span>`).join("")}</div>`;
}
function render(){
  $("#menuBtn").hidden=!S;
  $("#sub").textContent=S?`Rodada ${S.round} · meta ${S.settings.target} votos`:"Debate eleitoral de mesa";
  const v=$("#view");
  if(!S){v.innerHTML=vSetup();return}
  const f={crise:vCrise,propostas:vProps,debate:vDebate,urna:vUrna,votacao:vVotacao,apuracao:vApur,fim:vFim}[S.phase];
  v.innerHTML=f();

    </div>
    <p class="note" style="margin:0">Depois das falas, vale réplica livre. Quando a mesa cansar, abra a urna.</p>
    <button type="button" class="btn gold block" data-act="toUrna">${S.settings.voteMode==="urna"?"Abrir a urna":"Hora de votar"}</button>
  </div>`;
}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function syncTimer(){const c=$("#clock"),b=$("#timerBtn");if(!c)return;c.textContent=fmt(S.debate.left);c.classList.toggle("low",S.debate.left<=10);if(b)b.textContent=S.debate.running?"Pausar":S.debate.left===0?"Recomeçar":"Iniciar"}
function runTimer(on){clearInterval(timer);timer=null;S.debate.running=on;
  if(on){timer=setInterval(()=>{if(!S||S.phase!=="debate"){clearInterval(timer);return}S.debate.left=Math.max(0,S.debate.left-1);if(S.debate.left===0){runTimer(false);buzz();save()}syncTimer()},1000)}
  syncTimer()}

function lcdVoting(){
  const cand=typed.length===2?S.cands.map(P).find(p=>String(p.num)===typed):null;
  if(typed==="B")return `<div class="t1">SEU VOTO PARA</div><div class="t2">PRESIDENTE</div><div class="big">VOTO EM BRANCO</div>
    <div class="foot">Aperte a tecla:<br>VERDE para CONFIRMAR<br>LARANJA para CORRIGIR</div>`;
  let info="";
  if(typed.length===2)info=cand?`<div class="info"><div>Nome: ${esc(cand.name).toUpperCase()}</div><div>Proposta: ${esc(S.props[cand.id])}</div></div>`:`<div class="info"><div>NÚMERO ERRADO</div><div>VOTO NULO</div></div>`;
  return `<div class="t1">SEU VOTO PARA</div><div class="t2">PRESIDENTE</div>
    <div class="digits">Número: <span class="digit ${typed.length===0?"cur":""}">${typed[0]||""}</span><span class="digit ${typed.length===1?"cur":""}">${typed[1]||""}</span></div>
    ${info}
    <div class="foot">${typed.length===2?"Aperte a tecla:<br>VERDE para CONFIRMAR<br>LARANJA para CORRIGIR":"Na rodada: "+S.cands.map(P).map(p=>p.num+" "+esc(p.name)).join(" · ")}</div>`;
}
function vUrna(){
  const V=S.vote,id=S.voters[V.idx],p=P(id);
  const prog=`<div class="progress">${S.voters.map((_,i)=>`<i class="${i<V.idx||(i===V.idx&&V.stage==="fim")?"on":""}"></i>`).join("")}</div>`;
  if(V.stage==="cover")return `<div class="stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · votação secreta</span><h1>Cabine de votação</h1></div>${prog}
    <div class="panel cover"><span class="eyebrow">Entregue o celular para</span><div class="who">${esc(p.name)}</div><p class="lead">O resto da mesa não olha.</p>
    <button type="button" class="btn" data-act="enterBooth">Sou eu, quero votar</button></div>
    ${V.idx===0?`<button type="button" class="btn ghost small" data-act="toDebateBack" style="align-self:flex-start">Voltar ao debate</button>`:""}
  </div>`;
  const lcd=V.stage==="fim"?`<div class="fim">FIM</div><div class="foot" style="text-align:center">VOTOU</div>`:lcdVoting();
  return `<div class="stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Eleitor ${V.idx+1} de ${S.voters.length}</span><h2>${esc(p.name)}, seu voto</h2></div>${prog}
    <div class="urna" id="urna">
      <div class="lcd" aria-live="polite">${lcd}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button type="button" class="k ${n===0?"k0":""}" data-act="key" data-v="${n}" ${V.stage==="fim"?"disabled":""}>${n}</button>`).join("")}
        <div class="acts"><button type="button" class="kb" data-act="branco" ${V.stage==="fim"?"disabled":""}>BRANCO</button><button type="button" class="kc" data-act="corrige" ${V.stage==="fim"?"disabled":""}>CORRIGE</button><button type="button" class="kk" data-act="confirma" ${V.stage==="fim"?"disabled":""}>CONFIRMA</button></div>
      </div>
    </div>
    ${V.stage==="fim"?`<button type="button" class="btn block" data-act="nextVoter">${V.idx+1<S.voters.length?"Esconder e passar para "+esc(P(S.voters[V.idx+1]).name):"Ir para a apuração"}</button>`:""}
  </div>`;
}
function vVotacao(){
  const V=S.vote.votes,n=Object.keys(V).length,tot=S.voters.length;
  const opts=S.cands.map(id=>[id,P(id).num+" "+P(id).name]).concat([["branco","Branco"]]);
  return `<div class="stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · votação aberta</span><h1>Em quem você vota?</h1><p class="lead">Cada eleitor fala o voto em voz alta. Toque no nome de quem ele escolheu.</p></div>
    <div class="stack" style="gap:10px">${S.voters.map(vid=>`<div class="panel vrow"><div class="vname">${esc(P(vid).name)}${V[vid]?`<span class="ok">✓</span>`:""}</div>
      <div class="vopts">${opts.map(o=>`<button type="button" class="vopt ${o[0]==="branco"?"vb":""}" data-act="openVote" data-k="${vid}" data-v="${o[0]}" aria-pressed="${V[vid]===o[0]}">${esc(o[1])}</button>`).join("")}</div></div>`).join("")}</div>
    <button type="button" class="btn block ${n===tot?"gold":""}" data-act="apurar" ${n?"":"disabled"}>${n===tot?"Apurar os votos":`Apurar com ${n} de ${tot} votos`}</button>
    <button type="button" class="btn ghost small" data-act="toDebateBack" style="align-self:flex-start">Voltar ao debate</button>
  </div>`;
}
function vApur(){
  const R=S.result,max=Math.max(1,...Object.values(R.counts)),top=Math.max(...Object.values(R.counts)),done=leaders()[0].score>=S.settings.target;
  return `<div class="stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Rodada ${S.round} · apuração</span><h1>Urnas apuradas</h1></div>
    <div class="panel"><div class="bars">${S.cands.map(id=>{const p=P(id),c=R.counts[id],win=c===top&&top>0;
      return `<div class="bar ${win?"win":""}"><div class="nm"><span>${p.num}</span>${esc(p.name)}${win?`<span class="eleito">VENCEU</span>`:""}</div><div class="v">${c}</div>
      <div class="track"><div class="fill" style="width:0" data-w="${c/max*100}%"></div></div><div class="p">${esc(S.props[id])}</div></div>`}).join("")}</div>
      ${R.branco||R.nulo?`<span class="note">Brancos: ${R.branco} · Nulos: ${R.nulo}</span>`:""}
    </div>
    <div class="panel"><span class="label">Placar geral</span><table class="table">${S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<tr><td>${p.num}&nbsp; ${esc(p.name)}</td><td>${p.score}</td></tr>`).join("")}</table></div>
    <button type="button" class="btn block ${done?"gold":""}" data-act="${done?"toFim":"nextRound"}">${done?"Anunciar o eleito":"Próxima rodada"}</button>
  </div>`;
}
function vFim(){
  const L=leaders();
  return `<div class="stack">
    <div class="panel winner"><span class="eyebrow">${L.length>1?"Empate técnico":"Eleito para presidente"}</span><div class="sash"></div>
    <div class="who">${L.map(p=>esc(p.name)).join(" e ")}</div><p class="lead">${L[0].score} votos em ${S.round} rodadas</p></div>
    <div class="panel"><span class="label">Resultado final</span><table class="table">${S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<tr><td>${p.num}&nbsp; ${esc(p.name)}</td><td>${p.score}</td></tr>`).join("")}</table></div>
    <div class="row"><button type="button" class="btn" data-act="rematch">Revanche com a mesma mesa</button><button type="button" class="btn ghost" data-act="endGame">Nova partida</button></div>
  </div>`;
}

/* ---------- sheets ---------- */
function openSheet(k){sheet=k;confirmEnd=false;renderSheet();$("#sheet").hidden=false}
function closeSheet(){sheet=null;$("#sheet").hidden=true}
function renderSheet(){
  const el=$("#sheetIn");
  const head=t=>`<div class="sheet-head"><h2>${t}</h2><button type="button" class="btn ghost small" data-act="close">Fechar</button></div>`;
  if(sheet==="regras")el.innerHTML=head("Como jogar")+`<div class="rules"><ol>
    <li>Cada rodada, alguns jogadores viram <b>candidatos</b> e o resto da mesa vira <b>eleitor</b>. Todo mundo reveza.</li>
    <li>Revele a <b>crise</b> e leia em voz alta. É o problema que o país precisa resolver.</li>
    <li>Cada candidato revela seu <b>santinho</b> com uma proposta sorteada. Pode ser séria, pode ser pão de queijo. Ele tem que defender que ela resolve a crise.</li>
    <li>No <b>debate</b>, cada um fala no seu tempo. Depois vale réplica livre.</li>
    <li>Na <b>votação aberta</b>, cada eleitor fala em quem vota e alguém marca no celular. Se preferirem voto secreto, escolham a <b>urna</b>: o celular passa de mão em mão e cada um digita o número do candidato.</li>
    <li>Cada voto vira um ponto. Quem chegar primeiro à meta de votos é eleito.</li>
    </ol><p class="note">No menu Baralho você adiciona crises e propostas da galera, com as piadas internas de vocês.</p></div>`;
  if(sheet==="menu")el.innerHTML=head("Partida")+`<div class="panel"><span class="label">Placar · rodada ${S.round}</span><table class="table">${S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<tr><td>${p.num}&nbsp; ${esc(p.name)}</td><td>${p.score}</td></tr>`).join("")}</table></div>
    <div class="panel"><span class="label">Votação</span>${seg("voteMode",[["aberta","Aberta"],["urna","Urna secreta"]],S.settings.voteMode)}<span class="note">Vale a partir da próxima votação.</span></div>
    <div class="stack"><button type="button" class="btn ghost" data-act="skipRound">Sortear outra crise para esta rodada</button>
    ${confirmEnd?`<div class="panel"><span>Encerrar a partida e apagar o placar?</span><div class="row"><button type="button" class="btn" style="background:var(--danger);color:var(--surface)" data-act="endGame">Encerrar</button><button type="button" class="btn ghost" data-act="cancelEnd">Continuar jogando</button></div></div>`:`<button type="button" class="btn ghost" data-act="askEnd">Encerrar partida</button>`}</div>`;
  if(sheet==="baralho"){
    const list=(arr,k)=>arr.length?`<ul class="clist">${arr.map((t,i)=>`<li><span>${esc(t)}</span><button type="button" data-act="delCard" data-k="${k}" data-v="${i}" aria-label="Remover">×</button></li>`).join("")}</ul>`:`<span class="note">Nenhuma carta da galera ainda.</span>`;
    el.innerHTML=head("Baralho")+`
    <div class="panel"><div class="toggle"><div class="stack" style="gap:4px"><span class="label">Cartas padrão</span><span class="note">${DEF_CRISES.length} crises e ${DEF_PROPS.length} propostas</span></div><button type="button" class="switch" data-act="useDefault" aria-pressed="${C.useDefault}" aria-label="Usar cartas padrão"></button></div></div>
    <div class="panel"><span class="label">Crises da galera (${C.crises.length})</span>${list(C.crises,"crises")}
      <div class="prow"><input type="text" id="newCrise" placeholder="Ex.: O Zé chegou atrasado de novo e o país parou." maxlength="160"><button type="button" class="btn small" data-act="addCard" data-k="crises">Adicionar</button></div></div>
    <div class="panel"><span class="label">Propostas da galera (${C.props.length})</span>${list(C.props,"props")}
      <div class="prow"><input type="text" id="newProp" placeholder="Ex.: o churrasco do tio Jorge" maxlength="80"><button type="button" class="btn small" data-act="addCard" data-k="props">Adicionar</button></div></div>`;
  }
}
/* ---------- eventos ---------- */
function pressKey(n){if(S.vote.stage!=="voting")return;click();if(typed==="B")return;if(typed.length<2){typed+=String(n);render()}}
function confirmVote(){
  if(S.vote.stage!=="voting")return;
  if(typed!=="B"&&typed.length<2){const u=$("#urna");u&&(u.classList.remove("shake"),void u.offsetWidth,u.classList.add("shake"));return}
  const voter=S.voters[S.vote.idx];
  let v="nulo";if(typed==="B")v="branco";else{const c=S.cands.map(P).find(p=>String(p.num)===typed);if(c)v=c.id}
  S.vote.votes[voter]=v;S.vote.stage="fim";typed="";urnaSound();save();render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b){if(e.target.id==="sheet")closeSheet();return}
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case"sheet":openSheet(v);return;
    case"close":closeSheet();return;
    case"add":draft.names.push("");draft.example=false;save();render();$("#player-"+(draft.names.length-1))?.focus();return;
    case"rm":draft.names.splice(+v,1);draft.example=false;save();render();return;
    case"set":{const val=isNaN(+v)?v:+v;if(sheet==="menu"&&S){S.settings[b.dataset.k]=val;save();renderSheet();render();return}draft[b.dataset.k]=val;save();render();return}
    case"showAll":S.cands.forEach(id=>S.shown[id]=true);break;
    case"openVote":{const k=b.dataset.k;if(S.vote.votes[k]===v)delete S.vote.votes[k];else S.vote.votes[k]=v;click();save();render();return}
    case"apurar":tally();break;
    case"swaps":draft.swaps=!draft.swaps;save();render();return;
    case"start":startGame(false);break;
    case"revealCrise":S.crisisShown=true;break;
    case"toProps":S.phase="propostas";break;
    case"showProp":if(S.shown[v])return;S.shown[v]=true;break;
    case"swap":S.props[v]=drawUnique("p",new Set(Object.values(S.props)));S.swapped[v]=true;break;
    case"toDebate":S.phase="debate";S.debate={idx:0,left:S.settings.debateSec,running:false};break;
    case"timer":if(S.debate.left===0)S.debate.left=S.settings.debateSec;runTimer(!S.debate.running);save();return;
    case"plus":S.debate.left+=15;syncTimer();save();return;
    case"nextSpeaker":runTimer(false);if(S.debate.idx<S.cands.length-1){S.debate.idx++;S.debate.left=S.settings.debateSec}else{S.debate.idx=S.cands.length-1;S.debate.left=0;toast("Falas encerradas. Réplica livre ou abram a urna.")}break;
    case"toUrna":runTimer(false);S.phase=S.settings.voteMode==="urna"?"urna":"votacao";S.vote={idx:0,stage:"cover",votes:{}};typed="";break;
    case"toDebateBack":S.phase="debate";break;
    case"enterBooth":S.vote.stage="voting";typed="";break;
    case"key":pressKey(+v);return;
    case"branco":if(S.vote.stage==="voting"){click();typed="B";render()}return;
    case"corrige":if(S.vote.stage==="voting"){click();typed="";render()}return;
    case"confirma":confirmVote();return;
    case"nextVoter":if(S.vote.idx+1<S.voters.length){S.vote.idx++;S.vote.stage="cover"}else tally();break;
    case"nextRound":startRound();break;
    case"toFim":S.phase="fim";break;
    case"rematch":startGame(true);break;
    case"endGame":runTimer&&clearInterval(timer);S=null;closeSheet();break;
    case"askEnd":confirmEnd=true;renderSheet();return;
    case"cancelEnd":confirmEnd=false;renderSheet();return;
    case"skipRound":S.crisis=draw("c");S.crisisShown=false;S.phase="crise";closeSheet();break;
    case"useDefault":C.useDefault=!C.useDefault;if(S)S.bags={c:[],p:[]};save();renderSheet();return;
    case"addCard":{const inp=$(b.dataset.k==="crises"?"#newCrise":"#newProp"),t=inp.value.trim();if(!t){inp.focus();return}C[b.dataset.k].push(t);if(S)S.bags={c:[],p:[]};save();renderSheet();$(b.dataset.k==="crises"?"#newCrise":"#newProp")?.focus();return}
    case"delCard":C[b.dataset.k].splice(+v,1);if(S)S.bags={c:[],p:[]};save();renderSheet();return;
  }
  save();render();window.scrollTo({top:0,behavior:"smooth"});
});
document.addEventListener("input",e=>{if(e.target.dataset.i!==undefined){draft.names[+e.target.dataset.i]=e.target.value;draft.example=false;save()}});
document.addEventListener("keydown",e=>{
  if(sheet&&e.key==="Escape"){closeSheet();return}
  if(e.key==="Enter"&&e.target.id&&(e.target.id==="newCrise"||e.target.id==="newProp")){e.target.nextElementSibling.click();return}
  if(!S||S.phase!=="urna"||S.vote.stage!=="voting"||sheet)return;
  if(/^[0-9]$/.test(e.key))pressKey(+e.key);
  else if(e.key==="Backspace"){typed="";render()}
  else if(e.key==="Enter"){e.preventDefault();confirmVote()}
});

/* ---------- boot ---------- */
function start(data){
  load();
  if(data&&data.S!==undefined){S=data.S;if(data.C)C=data.C;if(data.draft)draft=data.draft}
  if(S&&S.debate)S.debate.running=false;
  render();
  window.claude?.hot?.snapshot?.(()=>({S,C,draft}));
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body>
</html>
