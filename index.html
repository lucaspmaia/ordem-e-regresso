<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1a19">
<meta name="description" content="Jogo de debate eleitoral para jogar presencialmente com os amigos.">
<title>Ordem e Regresso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=VT323&display=swap">
<style>
/* Layout: palanque à noite; cabeçalho, tabuleiro de votos, palco da fase e ação fixa no rodapé */
:root{
  --bg:#0d1a19; --bg2:#122221; --surface:#16292a; --raised:#1e3637; --line:#2c4a4a; --fg:#f4f0e4; --muted:#9db3ad;
  --paper:#f4efe1; --ink:#1d1a12; --gold:#f2c230; --on-gold:#231a02; --green:#1aa864; --blue:#3a64cc; --red:#d8453a; --coral:#ec6f52;
  --urna:#cfc7b0; --urna-edge:#a99f84; --lcd:#dfe8d2; --lcd-ink:#1a2a1d;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lcdfont:"VT323",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 90% 45% at 50% -8%,rgba(242,194,48,.17),transparent 70%),radial-gradient(ellipse 60% 40% at 110% 100%,rgba(58,100,204,.14),transparent 60%),radial-gradient(ellipse 60% 45% at -10% 75%,rgba(26,168,100,.13),transparent 60%),linear-gradient(#0d1a19,#0a1414)}
.bgfx i{position:absolute;width:3px;height:3px;border-radius:1px;opacity:.35;animation:fall 14s linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 130px;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(13,26,25,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-weight:900;font-size:1.35rem;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.flag{width:26px;height:18px;border-radius:3px;background:var(--green);position:relative;flex:none}
.flag::before{content:"";position:absolute;inset:2px 3px;background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.flag::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--blue);left:50%;top:50%;transform:translate(-50%,-50%)}
.topbtns{display:flex;gap:6px;align-items:center}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:700;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.pill svg{width:16px;height:16px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.98;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:2.5rem}h2{font-size:1.8rem}h3{font-size:1.3rem}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:linear-gradient(180deg,rgba(30,54,55,.6),rgba(22,41,42,.85));border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:1.02rem;background:linear-gradient(180deg,#ffd75a,var(--gold));color:var(--on-gold);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;box-shadow:0 4px 0 #b38a12,0 10px 24px rgba(242,194,48,.22);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b38a12}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost::after,.btn:disabled::after{display:none}
.btn.green{background:linear-gradient(180deg,#34c97f,var(--green));color:#032213;box-shadow:0 4px 0 #0d6b3e}
.btn.red{background:linear-gradient(180deg,#f06b5f,var(--red));color:#fff;box-shadow:0 4px 0 #8e2a22}
.btn.small{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.l{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{width:100%;font:inherit;font-size:1.02rem;background:rgba(5,12,12,.55);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.note{font-size:.86rem;color:var(--muted);margin:0}
.fresh .fade-in{animation:fadeUp .45s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes popIn{from{opacity:0;transform:scale(.8) rotate(-2deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hopIdle{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}55%{transform:translateY(0) scaleY(.94)}}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:10px 4px;font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:left .2s var(--spring)}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{left:25px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* início */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:20px 0}
.poster{position:relative;width:230px;height:150px}
.poster .dia{position:absolute;inset:0;background:var(--green);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.poster .dia::before{content:"";position:absolute;inset:14px 18px;background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:breathe 4s ease-in-out infinite}
.poster .dia::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5b82e0,var(--blue));left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.2)}
.poster .band{position:absolute;left:50%;top:50%;width:84px;transform:translate(-50%,-50%) rotate(-12deg);background:var(--paper);color:var(--ink);font:800 .58rem var(--body);letter-spacing:.1em;padding:2px 0;text-align:center;z-index:2}
@keyframes breathe{50%{transform:scale(1.04)}}
.hero h1{font-size:3.4rem;line-height:.9}
.hero h1 span{display:block;color:var(--gold)}
.parade{display:flex;justify-content:center;gap:2px}
.parade span{animation:bob 2.2s ease-in-out infinite}
.parade span:nth-child(2n){animation-delay:-.6s}.parade span:nth-child(3n){animation-delay:-1.2s}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center;animation:fadeUp .35s var(--ease) both}
.prow input{flex:1;min-width:0}
.pawnbtn{flex:none;width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(5,12,12,.45);display:flex;align-items:center;justify-content:center;padding:0}
.x{background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:1.2rem;color:var(--muted);flex:none}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.deck{position:relative;border:1px solid var(--line);background:rgba(5,12,12,.4);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;transition:transform .2s var(--spring),background .2s}
.deck[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,194,48,.10)}
.deck b{font-family:var(--display);font-size:1.08rem;overflow-wrap:anywhere;text-transform:uppercase;line-height:1;padding-right:24px}
.deck small{color:var(--muted);font-size:.78rem;line-height:1.3}
.deck .ex{font-size:.78rem;line-height:1.3;color:var(--fg);opacity:.85;background:rgba(244,239,225,.06);border-left:3px solid var(--gold);padding:6px 8px;border-radius:0 6px 6px 0}
.deck .tone{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.deck .chk{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800}
.deck[aria-pressed="true"] .chk{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pw{border:1px solid var(--line);background:rgba(5,12,12,.45);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;min-width:0}
.pw .who{font-weight:400;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.pw.taken{opacity:.4}
.pw.mine{background:rgba(242,194,48,.14);border-color:var(--gold)}
.pw.mine svg{animation:hopIdle 1.6s ease-in-out infinite}

/* tabuleiro */
.board{position:relative;border-radius:18px;background:radial-gradient(ellipse at 30% 20%,#2c6b3f,#1d4f30 45%,#143a23);border:2px solid #2e6b42;box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),0 12px 28px rgba(0,0,0,.35);overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
.bhead{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 0;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d9f0df}
.bhead button{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#eaf7ee}
.mini{position:relative;height:66px;margin:4px 16px 6px}
.mini .line{position:absolute;left:0;right:0;top:48px;height:8px;border-radius:4px;background:rgba(0,0,0,.28)}
.mini .tick{position:absolute;top:44px;width:2px;height:16px;background:rgba(255,255,255,.25);transform:translateX(-1px)}
.mini .goal{position:absolute;right:-8px;top:38px;font-size:1rem;color:var(--gold)}
.mini .mp{position:absolute;top:0;transform:translateX(-50%);transition:left .26s var(--ease)}
.full{position:relative;margin:2px 6px 8px}
.full svg.track{width:100%;height:auto;display:block}
.full .fp{position:absolute;transform:translate(-50%,-88%);transition:left .26s var(--ease),top .26s var(--ease)}
.hop .pawn-svg{animation:hop .28s var(--ease)}
@keyframes hop{40%{transform:translateY(-14px) scale(1.05)}80%{transform:translateY(0) scaleY(.9)}}
.gainpop{position:absolute;font-family:var(--display);font-weight:900;font-size:1.4rem;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;animation:rise 1.4s var(--ease) forwards;transform:translate(-50%,-100%)}
@keyframes rise{from{opacity:0;margin-top:0}20%{opacity:1}to{opacity:0;margin-top:-40px}}

/* papéis */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles .panel{padding:12px;gap:8px}
.who-list{display:flex;flex-direction:column;gap:4px}
.who-list div{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}
.who-list div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-list .pawn-svg{flex:none;animation:bob 2.4s ease-in-out infinite}

/* carta de crise */
.flip{perspective:1400px;border:0;background:none;padding:0;width:100%;text-align:left;display:block}
.flip-in{position:relative;transform-style:preserve-3d;min-height:300px}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip.on.go .flip-in{animation:flipTo .8s var(--ease) both}
@keyframes flipTo{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.cardback{background:repeating-linear-gradient(45deg,#1e3f8f 0 14px,#24479e 14px 28px);align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;border:6px solid var(--paper);box-shadow:0 18px 36px rgba(0,0,0,.5);color:var(--paper)}
.cardback .big{font-family:var(--display);font-weight:900;font-size:2.4rem;text-transform:uppercase;line-height:.92;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.cardback .tap{font-size:.85rem;font-weight:700;opacity:.9;animation:bob 1.6s ease-in-out infinite}
.news{background:var(--paper);color:var(--ink);padding:16px 18px;gap:12px;overflow:hidden;box-shadow:0 18px 36px rgba(0,0,0,.5)}
.news::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 3px);pointer-events:none;border-radius:18px}
.news .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:6px;gap:8px}
.news .mast b{font-family:var(--display);font-weight:900;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.news .mast span{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6c5f45;text-align:right}
.news .year{font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:.9;color:var(--red)}
.news p{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.05;margin:0 0 40px;text-transform:none;text-wrap:balance}
.stamp{position:absolute;right:14px;bottom:14px;font-family:var(--display);font-weight:900;font-size:1.4rem;letter-spacing:.06em;color:var(--red);border:3px solid var(--red);padding:2px 12px;transform:rotate(-8deg);border-radius:6px;opacity:.9}
.flip.on.go .stamp{animation:slam .5s .55s var(--spring) both}
@keyframes slam{from{opacity:0;transform:rotate(-8deg) scale(3)}}
.news.static{position:relative;border-radius:18px;min-height:0}
.news.static p{font-size:1.25rem;margin-bottom:30px}
.news.static .stamp{font-size:1.05rem;bottom:10px}
.news.static .year{font-size:1.8rem}

/* santinhos */
.santos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.santo .flip-in{min-height:300px}
.deal{animation:deal .7s var(--spring) both}
@keyframes deal{from{opacity:0;transform:translateY(-60vh) rotate(-30deg) scale(.4)}}
.sface{background:var(--paper);color:var(--ink);overflow:hidden;box-shadow:0 18px 36px rgba(0,0,0,.45)}
.sface .band{background:var(--gold);color:var(--on-gold);display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:900;letter-spacing:.14em;font-size:.75rem}
.sface .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;position:relative}
.sface .head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sface .num{font-family:var(--display);font-weight:900;font-size:3.6rem;line-height:.82;font-variant-numeric:tabular-nums}
.sface .nm{font-weight:800;font-size:1.05rem}
.sface .prop{margin-top:auto;border-top:2px dashed #cbbf9f;padding-top:10px}
.sface .prop .l{color:#7b6b4c;font-size:.66rem}
.sface .prop p{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.02;text-wrap:balance}
.sback{background:radial-gradient(circle at 50% 38%,rgba(242,194,48,.25),transparent 60%),repeating-linear-gradient(-45deg,#154a2c 0 12px,#185533 12px 24px);border:6px solid var(--paper);box-shadow:0 18px 36px rgba(0,0,0,.45);align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--paper)}
.sback .nm{font-family:var(--display);font-weight:900;font-size:1.8rem;text-transform:uppercase;line-height:1}
.sback .tap{font-size:.8rem;font-weight:700;opacity:.9}
.santo-act{display:flex;justify-content:center;min-height:42px;margin-top:8px}

/* debate */
.stagebox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:4px}
.spot{position:relative;width:180px;height:180px}
.spot svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.spot .pwn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.spot .pwn .pawn-svg{animation:talk .5s ease-in-out infinite alternate}
.spot.idle .pwn .pawn-svg{animation:bob 2.4s ease-in-out infinite}
@keyframes talk{to{transform:translateY(-4px) rotate(2deg)}}
.clock{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.clock.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.speaker .who{font-family:var(--display);font-weight:900;font-size:2.3rem;text-transform:uppercase;line-height:1}
.speaker .what{font-size:1.05rem;font-weight:600}
.speaker .what b{color:var(--gold)}
.order{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.order span{display:inline-flex;align-items:center;gap:4px;font-size:.84rem;padding:2px 10px 2px 4px;border-radius:999px;border:1px solid var(--line)}
.order span.cur{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.order span.done{opacity:.45}

/* votação aberta */
.vrow{padding:12px;gap:10px}
.vname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.vname .ok{color:var(--green);animation:popIn .3s var(--spring)}
.vopts{display:flex;flex-wrap:wrap;gap:8px}
.vopt{position:relative;flex:1 1 120px;min-height:54px;border:1px solid var(--line);background:rgba(5,12,12,.45);border-radius:12px;font-weight:800;padding:6px 10px;display:flex;align-items:center;gap:6px;justify-content:center;transition:transform .15s var(--spring)}
.vopt .n{font-family:var(--display);font-size:1.3rem}
.vopt.vb{flex:0 1 92px;font-weight:700;color:var(--muted)}
.vopt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#032213;transform:scale(1.03)}
.vopt.vb[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.vopt[aria-pressed="true"] .pawn-svg{animation:hopIdle .6s var(--ease)}

/* urna */
.urna{background:var(--urna);border:3px solid var(--urna-edge);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr;gap:14px;box-shadow:0 10px 0 var(--urna-edge),0 24px 40px rgba(0,0,0,.4)}
@media (min-width:640px){.urna{grid-template-columns:1.25fr 1fr;align-items:stretch}}
.lcd{background:var(--lcd);color:var(--lcd-ink);font-family:var(--lcdfont);border-radius:6px;padding:12px 14px;min-height:250px;display:flex;flex-direction:column;gap:6px;border:4px solid #1d1d1b;font-size:1.35rem;line-height:1.1}
.lcd .t2{font-size:1.9rem;text-align:center;letter-spacing:.04em}
.digits{display:flex;gap:8px;align-items:center}
.digit{width:38px;height:48px;border:2px solid var(--lcd-ink);display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.digit.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:var(--lcd-ink);color:var(--lcd)}}
.lcd .foot{margin-top:auto;border-top:2px solid var(--lcd-ink);padding-top:6px;font-size:1rem}
.lcd .big{font-size:2.2rem;text-align:center;margin:auto 0}
.lcd .fim{font-size:5rem;text-align:center;margin:auto 0;letter-spacing:.1em;animation:popIn .4s var(--spring)}
.keypad{background:#262624;border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad .k{background:#3b3b38;color:#f4f4f0;border:0;border-radius:6px;font-size:1.5rem;font-weight:700;height:52px;box-shadow:0 3px 0 #111}
.keypad .k:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
.keypad .k0{grid-column:2}
.keypad .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.keypad .acts button{border:0;border-radius:6px;font-weight:800;font-size:.8rem;letter-spacing:.05em;height:52px;box-shadow:0 3px 0 #111}
.kb{background:#f3f1ea;color:#1d1d1b}.kc{background:#e2772a;color:#1d1d1b}.kk{background:#159152;color:#fff}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cover{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.cover .who{font-family:var(--display);font-weight:900;font-size:2.8rem;text-transform:uppercase;line-height:1}
.progress{display:flex;gap:4px;justify-content:center}
.progress i{width:22px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--green)}

/* apuração */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rc{position:relative;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 30px rgba(0,0,0,.4);animation:fadeUp .5s var(--ease) both;animation-delay:var(--d0,0s)}
.rc .hd{display:flex;align-items:center;gap:10px}
.rc .num{font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:.9}
.rc .nm{font-weight:800;font-size:1.05rem}
.rc .pp{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.05;color:#4d4330}
.rc .toks{display:flex;flex-wrap:wrap;gap:2px;min-height:40px;align-items:flex-end;border-top:2px dashed #cbbf9f;padding-top:8px}
.tok{animation:drop .55s var(--spring) both;animation-delay:var(--d,1s);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
@keyframes drop{from{opacity:0;transform:translateY(-120px) scale(1.4)}}
.rc .cnt{position:absolute;top:12px;right:14px;font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:1}
.rc .win{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--green);color:#fff;font-weight:900;font-size:.72rem;letter-spacing:.12em;padding:4px 12px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 12px rgba(0,0,0,.3);animation:slam .5s var(--spring) both;animation-delay:var(--dw,2s)}
.rc.won{animation:fadeUp .5s var(--ease) both,glowGreen 1s var(--ease) both;animation-delay:var(--d0,0s),var(--dw,2s)}
@keyframes glowGreen{to{box-shadow:0 0 0 4px var(--green),0 0 34px rgba(26,168,100,.55),0 14px 30px rgba(0,0,0,.4)}}
.verdict{animation:popIn .6s var(--spring) both;animation-delay:var(--dv,.2s)}

/* fim */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-top:20px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%;max-width:130px}
.pod .stand{width:100%;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#ffd75a,#c79712);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--display);font-weight:900;font-size:1.9rem;color:#3a2a02;animation:grow .8s var(--spring) both}
.pod.p2 .stand{background:linear-gradient(180deg,#e7ecf5,#9aa4b8)}.pod.p3 .stand{background:linear-gradient(180deg,#f0b48a,#a96a3f)}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.pod .nm{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pawn-svg{animation:hopIdle 1.4s ease-in-out infinite}
.sash{background:linear-gradient(90deg,var(--green) 0 33%,var(--gold) 33% 66%,var(--blue) 66%);height:8px;width:160px;border-radius:4px;margin-inline:auto}
.track{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.tr .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .sc{font-family:var(--display);font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tr .bar{grid-column:2/4;height:7px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.tr .bar i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}

/* camadas */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(10,20,20,.98) 55%,rgba(10,20,20,0));display:flex;justify-content:center;animation:dockIn .35s var(--ease)}
.dock>*{max-width:728px;width:100%;display:flex;flex-direction:column;gap:8px}
@keyframes dockIn{from{transform:translateY(100%)}}
.sheet{position:fixed;inset:0;z-index:18;background:rgba(4,10,10,.72);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet-in{background:var(--bg2);border-top:1px solid var(--line);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding-inline:16px;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:sheetUp .35s var(--ease)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rules ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.clist li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.clist li span{min-width:0}
.clist li button{background:none;border:0;color:var(--muted);font-size:1.1rem;flex:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;animation:popIn .3s var(--spring)}
.phase{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(4,10,10,.78),rgba(4,10,10,0) 70%)}
.phase .in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 30px;max-width:92vw;animation:phaseIn 1.9s var(--ease) both}
.phase .t{font-family:var(--display);font-weight:900;font-size:3rem;line-height:.95;text-transform:uppercase;color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.6)}
.phase .s{font-size:1.05rem;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.8)}
@keyframes phaseIn{0%{opacity:0;transform:scale(.6) translateY(20px)}18%{opacity:1;transform:scale(1.05)}26%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08) translateY(-10px)}}
#fx{position:fixed;inset:0;z-index:26;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important}}
</style>

<body>
<div class="bgfx" id="bgfx"></div>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="flag"></span>Ordem e Regresso</div>
    <div class="topbtns">
      <button type="button" class="pill" data-act="sound" id="soundBtn" aria-label="Som"></button>
      <button type="button" class="pill" data-act="sheet" data-v="menu">Menu</button>
    </div>
  </header>
  <section id="boardWrap" hidden></section>
  <main id="stage" class="stack"></main>
</div>
<div class="dock" id="dock" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="phase" id="phase" hidden></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast" hidden></div>

<script src="decks.js"></script>
<script src="pawns.js"></script>
<script>
"use strict";
const D=window.OER_DECKS,THEMES=D.themes,PAWNS=DevaneioPawns.list;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="ordem-regresso-v2";
const pawnSvg=(k,s)=>DevaneioPawns.svg(k,s);
const pcolor=k=>DevaneioPawns.color(k);
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms||10)}catch(e){}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;t.style.animation="none";void t.offsetWidth;t.style.animation="";clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
(function confettiBg(){const cols=["#1aa864","#f2c230","#3a64cc","#f4efe1"];let h="";for(let i=0;i<22;i++)h+=`<i style="left:${Math.random()*100}%;background:${cols[i%4]};animation-delay:${-Math.random()*14}s;animation-duration:${10+Math.random()*10}s"></i>`;$("#bgfx").innerHTML+=h})();

/* ---------- estado ---------- */
let S=null;                // partida
let C={crises:[],props:[]}; // cartas da galera
let draft={players:[{name:"Ana",pawn:"coelho"},{name:"Beto",pawn:"raposa"},{name:"Caio",pawn:"sapo"},{name:"Duda",pawn:"coruja"}],example:true,
  perRound:2,target:8,debateSec:60,swaps:true,voteMode:"aberta",themes:["brasil","geo"],tone:"auto",galera:true};
let typed="",sheet=null,pickFor=null,confirmEnd=false,timer=null,soundOn=true,boardOpen=false,prevPhaseKey=null,disp={},boardBusy=false,lastStageHtml="",dealt=new Set(),revealed=new Set();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){S=d.S||null;if(d.C)C=d.C;if(d.draft)draft=Object.assign(draft,d.draft);if(d.sound===false)soundOn=false}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,C,draft,sound:soundOn}))}catch(e){}}
const P=id=>S.players.find(p=>p.id===id)||{name:"?",pawn:"fantasma",score:0};

/* ---------- som ---------- */
let AC=null;
function ac(){if(!soundOn)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){AC=null}return AC}
function tone(f,t,d,type,vol,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(t||0);o.type=type||"sine";o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.12,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
function noise(t,d,vol,freq){const a=ac();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type="bandpass";f.frequency.value=freq||2200;g.gain.value=vol||.25;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(t||0))}
const sfx={deal:i=>noise((i||0)*.1,.12,.22,2600),flip:()=>{noise(0,.07,.3,3800);tone(900,.02,.05,"triangle",.05)},tap:()=>tone(660,0,.07,"triangle",.07),
  stamp:()=>{noise(0,.12,.45,600);tone(110,0,.18,"sine",.2)},vote:i=>{tone(320,i||0,.12,"square",.05);tone(200,(i||0)+.02,.15,"sine",.12)},hop:i=>tone(440*Math.pow(1.06,i||0),0,.09,"triangle",.07),
  urna:()=>[0,.11,.22,.33,.44].forEach((t,i)=>tone(i%2?1400:1200,t,.09,"square",.05)),key:()=>tone(900,0,.03,"square",.04),buzzer:()=>tone(220,0,.5,"square",.08),
  phase:()=>{tone(392,0,.3,"sine",.06);tone(587,.08,.4,"sine",.06)},fanfare:()=>[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,i*.12,.35,"triangle",.09)),win:()=>[523,659,784].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.08))};
function soundIcon(){$("#soundBtn").innerHTML=soundOn?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`}
function confetti(n,ox,oy){const cv=$("#fx"),c=cv.getContext("2d");cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=["#1aa864","#f2c230","#3a64cc","#f4efe1","#ec6f52"],ps=[];const x0=ox==null?innerWidth/2:ox,y0=oy==null?innerHeight*.35:oy;
  for(let i=0;i<(n||140);i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;ps.push({x:x0,y:y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*6,s:4+Math.random()*7,c:cols[i%cols.length],vr:(Math.random()-.5)*.4})}
  let f=0;(function loop(){c.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()});if(++f<170)requestAnimationFrame(loop);else c.clearRect(0,0,innerWidth,innerHeight)})()}

/* ---------- baralhos ---------- */
function themeList(){const t=THEMES.slice();if(C.crises.length)t.push({key:"galera",nome:"Da galera",desc:"Cartas criadas por vocês",tom:"zoeira",crises:C.crises});return t}
const theme=k=>themeList().find(t=>t.key===k)||THEMES[0];
function crisisBag(){const out=[];S.settings.themes.forEach(k=>{const t=theme(k);t.crises.forEach((_,i)=>out.push(k+"|"+i))});return shuffle(out)}
function drawCrisis(){if(!S.bags.c||!S.bags.c.length)S.bags.c=crisisBag();const [k,i]=S.bags.c.pop().split("|");const t=theme(k);const raw=t.crises[+i]||t.crises[0];
  const m=raw.match(/^(\d{4})\s+—\s+(.*)$/);return{theme:k,year:m?m[1]:"",text:m?m[2]:raw}}
function propTone(){const tone=S.settings.tone;if(tone==="auto")return theme(S.crisis.theme).tom==="serio"?"serio":"zoeira";return tone}
function propPool(tone){const z=D.zoeira.concat(C.props),s=D.serio;return tone==="serio"?s:tone==="zoeira"?z:z.concat(s)}
function drawProp(taken){const tone=propTone();const key="p_"+tone;if(!S.bags[key]||!S.bags[key].length)S.bags[key]=shuffle(propPool(tone));let c=S.bags[key].pop(),n=0;while(taken.has(c)&&n++<20){if(!S.bags[key].length)S.bags[key]=shuffle(propPool(tone));c=S.bags[key].pop()}taken.add(c);return c}

/* ---------- regras do jogo ---------- */
function startGame(keep){
  let players;
  if(keep&&S)players=S.players.map(p=>({...p,score:0}));
  else{const rows=draft.players.map(p=>({name:p.name.trim(),pawn:p.pawn})).filter(p=>p.name);
    if(rows.length<3){toast("Coloque pelo menos 3 jogadores.");return}
    const used=new Set();players=rows.map((r,i)=>{let n;do{n=10+Math.floor(Math.random()*90)}while(used.has(n));used.add(n);return{id:"p"+i+"_"+Date.now().toString(36),name:r.name,pawn:r.pawn,num:n,score:0}})}
  const st=keep&&S?S.settings:{perRound:Math.min(draft.perRound,players.length-1),target:draft.target,debateSec:draft.debateSec,swaps:draft.swaps,voteMode:draft.voteMode,themes:draft.themes.filter(k=>k!=="galera"||C.crises.length),tone:draft.tone};
  if(!st.themes.length)st.themes=["brasil"];
  S={players,settings:st,round:0,rot:Math.floor(Math.random()*players.length),bags:{}};disp={};players.forEach(p=>disp[p.id]=0);prevPhaseKey=null;
  startRound();save();render();wake()}
function startRound(){const n=S.players.length,k=S.settings.perRound,cands=[];for(let i=0;i<k;i++)cands.push(S.players[(S.rot+i)%n].id);S.rot=(S.rot+k)%n;S.round++;
  S.cands=cands;S.voters=shuffle(S.players.map(p=>p.id).filter(id=>!cands.includes(id)));S.crisis=drawCrisis();S.crisisShown=false;
  const taken=new Set();S.props={};S.shown={};S.swapped={};cands.forEach(id=>S.props[id]=drawProp(taken));
  S.debate={idx:0,left:S.settings.debateSec,running:false};S.vote={idx:0,stage:"cover",votes:{}};S.result=null;S.phase="crise";typed=""}
function tally(){const counts={};S.cands.forEach(id=>counts[id]=0);let branco=0,nulo=0;
  Object.values(S.vote.votes).forEach(v=>{if(v==="branco")branco++;else if(v==="nulo")nulo++;else if(counts[v]!==undefined)counts[v]++});
  S.cands.forEach(id=>P(id).score+=counts[id]);S.result={counts,branco,nulo,votes:Object.assign({},S.vote.votes)};S.phase="apuracao"}
const leaders=()=>{const m=Math.max(...S.players.map(p=>p.score));return S.players.filter(p=>p.score===m)};

/* ---------- tabuleiro ---------- */
function geom(t){const cols=8,n=t+1,rows=Math.ceil(n/cols),W=800,rowH=100,H=rows*rowH+20,pts=[];for(let i=0;i<n;i++){const r=Math.floor(i/cols),k=i%cols,c=r%2?cols-1-k:k;pts.push({x:60+c*(680/(cols-1)),y:62+r*rowH})}return{W,H,pts}}
let boardKey="";
function boardHTML(){const t=S.settings.target,g=geom(t),path=g.pts.map((p,i)=>(i?"L":"M")+p.x+" "+p.y).join(" ");
  const sp=g.pts.map((p,i)=>{const last=i===t,five=i%5===0;return `<circle cx="${p.x}" cy="${p.y}" r="${last?30:24}" fill="${last?"#f2c230":five?"#f4efe1":"#e5dcc4"}" stroke="${last?"#a87f0d":five?"#f2c230":"#b5a67e"}" stroke-width="${five||last?5:3}"/>${last?`<path d="M${p.x} ${p.y-14} l4.5 9.5 10.5 1.2-7.8 7 2.2 10.3-9.4-5.4-9.4 5.4 2.2-10.3-7.8-7 10.5-1.2z" fill="#231a02"/>`:`<text x="${p.x}" y="${p.y+7}" text-anchor="middle" font-size="${five?22:18}" font-weight="800" fill="#2f2610" font-family="Figtree,sans-serif">${i}</text>`}`}).join("");
  const full=`<div class="full"><svg class="track" viewBox="0 0 ${g.W} ${g.H}"><path d="${path}" stroke="rgba(0,0,0,.25)" stroke-width="34" fill="none" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,4)"/><path d="${path}" stroke="#c9b47a" stroke-width="30" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${path}" stroke="#ece0bd" stroke-width="22" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 14"/>${sp}</svg>${S.players.map(p=>`<div class="fp" data-pid="${p.id}">${pawnSvg(p.pawn,30)}</div>`).join("")}</div>`;
  const ticks=[...Array(Math.floor(t/5)+1)].map((_,i)=>`<span class="tick" style="left:${i*5/t*100}%"></span>`).join("");
  const mini=`<div class="mini"><div class="line"></div>${ticks}<span class="goal">★</span>${S.players.map(p=>`<div class="mp" data-pid="${p.id}">${pawnSvg(p.pawn,26)}</div>`).join("")}</div>`;
  return `<div class="board"><div class="bhead"><span>Corrida eleitoral · ${t} votos</span><button type="button" data-act="board">${boardOpen?"Recolher":"Expandir"}</button></div>${boardOpen?full:mini}</div>`}

function vFim(){const rank=S.players.slice().sort((a,b)=>b.score-a.score),L=leaders();
  const pod=[rank[1],rank[0],rank[2]].map((p,i)=>p?`<div class="pod ${["p2","p1","p3"][i]}">${pawnSvg(p.pawn,i===1?66:48)}<span class="nm">${esc(p.name)}</span><div class="stand" style="height:${[70,110,50][i]}px;animation-delay:${[.3,.1,.5][i]}s">${[2,1,3][i]}</div></div>`:`<div class="pod"></div>`).join("");
  dock(`<div class="row" style="flex-wrap:nowrap"><button type="button" class="btn ghost" data-act="endGame" style="flex:1">Nova partida</button><button type="button" class="btn" data-act="rematch" style="flex:1.3">Revanche</button></div>`);
  return `<div class="stack fade-in" style="gap:8px;text-align:center"><span class="eyebrow">${L.length>1?"Empate técnico":"Eleito para presidente"}</span><div class="sash"></div><h1>${L.map(p=>esc(p.name)).join(" e ")}</h1><p class="lead" style="margin-inline:auto">${L[0].score} votos em ${S.round} rodadas</p></div><div class="podium">${pod}</div><div class="panel">${track()}</div>`}

/* ---------- menus ---------- */
function openSheet(k){sheet=k;confirmEnd=false;renderSheet();$("#sheet").hidden=false}
function closeSheet(){sheet=null;pickFor=null;$("#sheet").hidden=true}
function renderSheet(){const el=$("#sheetIn");const head=t=>`<div class="sheet-head"><h2>${t}</h2><button type="button" class="btn ghost small" data-act="close">Fechar</button></div>`;
  const rules=`<div class="rules"><ol><li>Cada rodada, alguns jogadores viram <b>candidatos</b> e o resto da mesa vira <b>eleitor</b>. Todo mundo reveza.</li><li>Revele a <b>crise</b> e leia em voz alta.</li><li>Cada candidato vira o seu <b>santinho</b> e descobre com o que vai resolver a crise. Nos baralhos políticos, as propostas são sérias; no Brasil de hoje, pode cair pão de queijo.</li><li>No <b>debate</b>, cada um defende sua tese no tempo de fala. Depois vale réplica.</li><li>Na <b>votação</b>, cada eleitor vota em quem convenceu mais. Pode ser aberta ou na urna secreta.</li><li>Cada voto é um passo no tabuleiro. Quem chegar primeiro à meta é eleito.</li></ol><p class="note">Os cenários dos baralhos políticos são inspirados em fatos reais.</p></div>`;
  if(sheet==="pawn"){const i=pickFor;const used={};draft.players.forEach((p,k)=>{if(k!==i)used[p.pawn]=p.name||"Outro"});
    el.innerHTML=head("Escolha o boneco")+`<div class="pick">${PAWNS.map(pw=>{const mine=draft.players[i]&&draft.players[i].pawn===pw.k,t=used[pw.k];return `<button type="button" class="pw ${mine?"mine":t?"taken":""}" data-act="setPawn" data-v="${pw.k}" ${t&&!mine?"disabled":""}>${pawnSvg(pw.k,38)}<span>${pw.nome}</span>${t&&!mine?`<span class="who">${esc(t)}</span>`:""}</button>`}).join("")}</div>`;return}
  if(sheet==="menu"){let h=head("Menu");if(S)h+=`<div class="panel"><span class="l">Placar · rodada ${S.round}</span>${track()}</div><button type="button" class="btn ghost" data-act="skipRound">Sortear outra crise para esta rodada</button>`;
    h+=`<div class="panel"><span class="l">Como jogar</span>${rules}</div>`;
    const list=(arr,k)=>arr.length?`<ul class="clist">${arr.map((t,i)=>`<li><span>${esc(t)}</span><button type="button" data-act="delCard" data-k="${k}" data-v="${i}" aria-label="Remover">×</button></li>`).join("")}</ul>`:`<span class="note">Nenhuma carta ainda.</span>`;
    h+=`<div class="panel"><span class="l">Cartas da galera</span><p class="note">Crises da galera viram o baralho "Da galera". Propostas da galera entram nas de zoeira.</p>
      <span class="l">Crises (${C.crises.length})</span>${list(C.crises,"crises")}<div class="row" style="flex-wrap:nowrap"><input type="text" id="newCrise" placeholder="Ex.: O Zé chegou atrasado de novo e o país parou." maxlength="160" style="flex:1;min-width:0"><button type="button" class="btn small" data-act="addCard" data-k="crises">Adicionar</button></div>
      <span class="l">Propostas (${C.props.length})</span>${list(C.props,"props")}<div class="row" style="flex-wrap:nowrap"><input type="text" id="newProp" placeholder="Ex.: o churrasco do tio Jorge" maxlength="80" style="flex:1;min-width:0"><button type="button" class="btn small" data-act="addCard" data-k="props">Adicionar</button></div></div>`;
    if(S)h+=confirmEnd?`<div class="panel"><span>Encerrar a partida e apagar o placar?</span><div class="row"><button type="button" class="btn red small" data-act="endGame">Encerrar</button><button type="button" class="btn ghost small" data-act="cancelEnd">Continuar jogando</button></div></div>`:`<button type="button" class="btn ghost" data-act="askEnd">Encerrar partida</button>`;
    el.innerHTML=h}}

/* ---------- eventos ---------- */
function pressKey(n){if(S.vote.stage!=="voting")return;sfx.key();if(typed==="B")return;if(typed.length<2){typed+=String(n);lastStageHtml="";render()}}
function confirmVote(){if(S.vote.stage!=="voting")return;if(typed!=="B"&&typed.length<2){const u=$("#urna");u&&(u.classList.remove("shake"),void u.offsetWidth,u.classList.add("shake"));return}
  const voter=S.voters[S.vote.idx];let v="nulo";if(typed==="B")v="branco";else{const c=S.cands.map(P).find(p=>String(p.num)===typed);if(c)v=c.id}S.vote.votes[voter]=v;S.vote.stage="fim";typed="";sfx.urna();buzz(30);save();render()}
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;ac();
  switch(a){
    case"sound":soundOn=!soundOn;save();soundIcon();if(soundOn)sfx.tap();return;
    case"sheet":openSheet(v);return;
    case"close":closeSheet();return;
    case"board":boardOpen=!boardOpen;boardKey="";renderBoard();return;
    case"add":{const used=new Set(draft.players.map(p=>p.pawn));draft.players.push({name:"",pawn:(PAWNS.find(p=>!used.has(p.k))||PAWNS[0]).k});draft.example=false;save();render();sfx.tap();setTimeout(()=>$("#player-"+(draft.players.length-1))?.focus(),50)}return;
    case"rm":if(draft.players.length<=1)return;draft.players.splice(+v,1);draft.example=false;save();render();return;
    case"pickPawn":pickFor=+v;openSheet("pawn");return;
    case"setPawn":if(pickFor!=null&&draft.players[pickFor]){draft.players[pickFor].pawn=v;save();sfx.tap();buzz();closeSheet();render()}return;
    case"set":{const k=b.dataset.k,val=isNaN(+v)?v:+v;draft[k]=val;if(S&&S.settings&&k==="voteMode")S.settings.voteMode=val;save();sfx.tap();render()}return;
    case"swaps":draft.swaps=!draft.swaps;save();sfx.tap();render();return;
    case"theme":{let t=draft.themes.slice();if(t.includes(v)){if(t.length===1){toast("Escolha pelo menos um baralho.");return}t=t.filter(x=>x!==v)}else t.push(v);draft.themes=t;save();sfx.tap();render()}return;
    case"start":sfx.tap();startGame(false);return;
    case"revealCrise":if(S.crisisShown)return;S.crisisShown=true;goFlip.add("crise");sfx.flip();setTimeout(()=>{sfx.stamp();buzz(40)},600);break;
    case"toProps":S.phase="propostas";break;
    case"showProp":if(S.shown[v])return;S.shown[v]=true;goFlip.add(v);sfx.flip();buzz();break;
    case"showAll":S.cands.forEach((id,i)=>{if(!S.shown[id]){goFlip.add(id);setTimeout(()=>sfx.flip(),i*120)}S.shown[id]=true});break;
    case"swap":S.props[v]=drawProp(new Set(Object.values(S.props)));S.swapped[v]=true;sfx.deal();break;
    case"toDebate":S.phase="debate";S.debate={idx:0,left:S.settings.debateSec,running:false};break;
    case"timer":if(S.debate.left===0)S.debate.left=S.settings.debateSec;sfx.tap();runTimer(!S.debate.running);save();return;
    case"plus":S.debate.left+=15;sfx.tap();syncTimer();save();return;
    case"nextSpeaker":runTimer(false);if(S.debate.idx<S.cands.length-1){S.debate.idx++;S.debate.left=S.settings.debateSec;sfx.tap()}else{S.debate.left=0;toast("Falas encerradas. Réplica livre ou hora de votar.")}break;
    case"toUrna":runTimer(false);S.phase=S.settings.voteMode==="urna"?"urna":"votacao";S.vote={idx:0,stage:"cover",votes:{}};typed="";break;
    case"toDebateBack":S.phase="debate";prevPhaseKey="debate|"+S.round;break;
    case"openVote":{const k=b.dataset.k;if(S.vote.votes[k]===v)delete S.vote.votes[k];else{S.vote.votes[k]=v;sfx.vote();buzz(15)}save();render()}return;
    case"apurar":tally();break;
    case"enterBooth":S.vote.stage="voting";typed="";break;
    case"key":pressKey(+v);return;
    case"branco":if(S.vote.stage==="voting"){sfx.key();typed="B";render()}return;
    case"corrige":if(S.vote.stage==="voting"){sfx.key();typed="";render()}return;
    case"confirma":confirmVote();return;
    case"nextVoter":if(S.vote.idx+1<S.voters.length){S.vote.idx++;S.vote.stage="cover"}else tally();break;
    case"nextRound":startRound();break;
    case"toFim":S.phase="fim";break;
    case"rematch":startGame(true);return;
    case"endGame":clearInterval(timer);S=null;closeSheet();prevPhaseKey=null;save();render();window.scrollTo({top:0});return;
    case"askEnd":confirmEnd=true;renderSheet();return;
    case"cancelEnd":confirmEnd=false;renderSheet();return;
    case"skipRound":S.crisis=drawCrisis();S.crisisShown=false;{const taken=new Set();S.cands.forEach(id=>S.props[id]=drawProp(taken))}S.shown={};S.swapped={};S.phase="crise";prevPhaseKey=null;closeSheet();break;
    case"addCard":{const inp=$(b.dataset.k==="crises"?"#newCrise":"#newProp"),t=inp.value.trim();if(!t){inp.focus();return}C[b.dataset.k].push(t);if(S)S.bags={};save();renderSheet();if(!S)render();$(b.dataset.k==="crises"?"#newCrise":"#newProp")?.focus()}return;
    case"delCard":C[b.dataset.k].splice(+v,1);if(!C.crises.length)draft.themes=draft.themes.filter(k=>k!=="galera").length?draft.themes.filter(k=>k!=="galera"):["brasil"];if(S)S.bags={};save();renderSheet();if(!S)render();return;
    default:return}
  save();render();window.scrollTo({top:0,behavior:"smooth"})});
document.addEventListener("input",e=>{if(e.target.dataset.i!==undefined){draft.players[+e.target.dataset.i].name=e.target.value;draft.example=false;save()}});
document.addEventListener("keydown",e=>{if(sheet&&e.key==="Escape"){closeSheet();return}
  if(e.key==="Enter"&&(e.target.id==="newCrise"||e.target.id==="newProp")){e.target.nextElementSibling.click();return}
  if(!S||S.phase!=="urna"||S.vote.stage!=="voting"||sheet)return;if(/^[0-9]$/.test(e.key))pressKey(+e.key);else if(e.key==="Backspace"){typed="";render()}else if(e.key==="Enter"){e.preventDefault();confirmVote()}});
async function wake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}
load();if(S){if(S.debate)S.debate.running=false;S.players.forEach(p=>disp[p.id]=p.score);prevPhaseKey=S.phase+"|"+S.round;if(S.phase==="apuracao")revealed.add("apur"+S.round);dealt.add("deal"+S.round)}
render();
</script>
</body>
</html>
